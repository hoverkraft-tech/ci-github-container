---
name: Test for "docker-build-images" workflow - Building
run-name: Test for "docker-build-images" workflow - Building

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      CI_BOT_APP_PRIVATE_KEY:
        required: false

permissions: {}

# jscpd:ignore-start
jobs:
  candidate-inputs:
    name: Assert candidate workflow image selection
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const assert = require('node:assert/strict');
            const { stdout } = await exec.getExecOutput('ruby', [
              '-rjson', '-ryaml', '-e', 'puts JSON.generate(YAML.safe_load(File.read(ARGV[0])))',
              '.github/workflows/docker-build-images.yml',
            ]);
            const script = JSON.parse(stdout).jobs['prepare-variables'].steps.find(step => step.id === 'validate-inputs').with.script;
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
            async function validate(images) {
              const outputs = {};
              await new AsyncFunction('process', 'context', 'core', script)(
                { env: { CANDIDATE_INPUT: 'true', OCI_REGISTRY_PASSWORD: 'fixture', RUNS_ON_INPUT: '["ubuntu-latest"]', IMAGES_INPUT: JSON.stringify(images) } },
                { repo: { owner: 'example', repo: 'app' } }, { setOutput: (key, value) => { outputs[key] = value; } },
              );
              return JSON.parse(outputs.images);
            }
            const single = { name: 'single', platforms: ['linux/amd64'], tag: '1.2.3' };
            const multi = { name: 'multi', platforms: ['linux/amd64', 'linux/arm64'] };
            assert.equal((await validate([single, multi])).length, 2);
            await assert.rejects(validate([]), /non-empty list with unique image names/);
            await assert.rejects(validate([single, { ...single, target: 'other' }]), /unique image names/);

  act-build-images-args-secrets:
    name: Arrange - Build with args, secrets
    uses: $/.github/workflows/docker-build-images.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
      build-secrets: |
        SECRET_TEST=test-secret
        SECRET_ANOTHER_TEST=another-test-secret
      build-secret-github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
    with:
      sign: false
      images: |
        [
          {
            "name": "test-build-args-secrets",
            "context": ".",
            "target": "test",
            "dockerfile": "./tests/application/Dockerfile",
            "platforms": ["linux/amd64"],
            "build-args": {
              "BUILD_RUN_ID": "${{ github.run_id }}",
              "BUILD_ARG_TEST": "test-arg",
              "BUILD_ARG_ANOTHER_TEST": "another-test-arg"
            },
            "secret-envs": {
              "SECRET_ENV_TEST": "GITHUB_ACTION",
              "SECRET_ENV_ANOTHER_TEST": "GITHUB_JOB"
            }
          }
        ]
      build-secret-github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
      build-secret-github-app-token-env: |
        SECRET_ENV_GITHUB_APP_TOKEN_1
        SECRET_ENV_GITHUB_APP_TOKEN_2

  assert-build-args-secrets:
    name: Assert - Build with args, secrets
    needs: act-build-images-args-secrets
    runs-on: "ubuntu-latest"
    steps:
      - name: Check built images output
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILT_IMAGES_OUTPUT: ${{ needs.act-build-images-args-secrets.outputs.built-images }}
        with:
          script: |
            const assert = require("assert");

            const builtImagesOutput = process.env.BUILT_IMAGES_OUTPUT;
            assert(builtImagesOutput.length, `"built-images" output is empty`);

            // Check if is valid Json
            let builtImages = null;
            try {
              builtImages = JSON.parse(builtImagesOutput);
            } catch (error) {
              throw new Error(`"built-images" output is not a valid JSON: ${error}`);
            }

            const expectedCreatedImages = [
              "test-build-args-secrets"
            ];

            assert(typeof builtImages === "object" && !Array.isArray(builtImages), `"built-images" output is not an object`);
            assert.equal(Object.keys(builtImages).length, expectedCreatedImages.length, `"built-images" output does not contain ${expectedCreatedImages.length} images`);

            for (const image of expectedCreatedImages) {
              assert(builtImages[image], `"built-images" output does not contain "${image}" image`);
            }

  act-candidates:
    name: Build signed candidates with final metadata
    uses: $/.github/workflows/docker-build-images.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
    with:
      candidate: true
      images: |
        [
          {
            "name": "test-candidate-${{ github.run_id }}-${{ github.run_attempt }}-single",
            "dockerfile": "tests/application/Dockerfile",
            "target": "base",
            "platforms": ["linux/amd64"],
            "tag": "1.2.3"
          },
          {
            "name": "test-candidate-${{ github.run_id }}-${{ github.run_attempt }}-multi",
            "dockerfile": "tests/application/Dockerfile",
            "target": "base",
            "platforms": ["linux/amd64", "linux/arm64"],
            "tag": "1.2.3"
          }
        ]

  assert-candidates:
    name: Assert candidate outputs, tags and security metadata
    needs: act-candidates
    outputs:
      validated-images: ${{ needs.act-candidates.outputs.built-images }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/actions/docker/setup
        with:
          oci-registry: ghcr.io
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - id: inspect-candidates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILT_IMAGES: ${{ needs.act-candidates.outputs.built-images }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const images = Object.values(JSON.parse(process.env.BUILT_IMAGES));
            assert.equal(images.length, 2);
            for (const image of images) {
              const repository = `${image.registry}/${image.repository}`;
              assert.deepEqual(image.candidate.destinations, [`${repository}:1.2.3`]);
              assert.equal(image.candidate.source.repository, process.env.GITHUB_REPOSITORY);
              assert.match(image.candidate.source.revision, /^[a-f0-9]{40}$/);
              assert.deepEqual(image.candidate.run, {
                id: process.env.GITHUB_RUN_ID, attempt: process.env.GITHUB_RUN_ATTEMPT,
              });
              assert.equal(image.tags.length, 1);
              assert(image.tags[0].startsWith(`candidate-${process.env.GITHUB_REPOSITORY_ID}-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-`));
              assert.deepEqual(image.images, [`${repository}:${image.tags[0]}@${image.digest}`]);
              const reference = `${repository}@${image.digest}`;
              const { stdout: inspected } = await exec.getExecOutput('docker', ['buildx', 'imagetools', 'inspect', `${repository}:${image.tags[0]}`]);
              assert.equal(inspected.match(/Digest:\s+(sha256:[a-f0-9]{64})/)[1], image.digest);
              const { stdout: raw } = await exec.getExecOutput('docker', ['buildx', 'imagetools', 'inspect', '--raw', reference]);
              const manifest = JSON.parse(raw);
              if (image.name.endsWith('-multi')) {
                assert.deepEqual(manifest.manifests.map(item => `${item.platform.os}/${item.platform.architecture}`).sort(), ['linux/amd64', 'linux/arm64']);
                assert.equal(manifest.annotations['org.opencontainers.image.version'], '1.2.3');
              } else {
                assert(manifest.config, 'Single-platform candidate must retain its image manifest');
              }
              await exec.exec('docker', ['pull', '--platform', 'linux/amd64', reference]);
              const { stdout: config } = await exec.getExecOutput('docker', ['image', 'inspect', reference]);
              const labels = JSON.parse(config)[0].Config.Labels;
              assert.equal(labels['org.opencontainers.image.version'], '1.2.3');
              assert.equal(labels['org.opencontainers.image.revision'], image.candidate.source.revision);
              const versions = await github.paginate(github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg, {
                package_type: 'container', package_name: `${context.repo.repo}/${image.name}`,
                org: context.repo.owner, per_page: 100,
              });
              const tags = versions.flatMap(version => version.metadata.container.tags);
              assert(tags.includes(image.tags[0]));
              assert(tags.every(tag => tag === image.tags[0] || tag.startsWith('sha256-')), `Unexpected consumer tag: ${tags}`);
              await exec.exec('gh', ['attestation', 'verify', `oci://${reference}`, '--repo', process.env.GITHUB_REPOSITORY]);
            }
            core.setOutput('references', JSON.stringify(images.map(image => `${image.registry}/${image.repository}@${image.digest}`)));

      - name: Verify candidate signatures
        id: verify-candidates
        uses: $/actions/docker/verify-images
        with:
          images: ${{ steps.inspect-candidates.outputs.references }}
          certificate-identity-regexp: '^https://github\.com/hoverkraft-tech/ci-github-container/\.github/workflows/docker-build-images\.yml@.+$'

      - name: Reject a different signer
        id: wrong-signer
        continue-on-error: true
        uses: $/actions/docker/verify-images
        with:
          images: ${{ steps.inspect-candidates.outputs.references }}
          certificate-identity: https://github.com/untrusted/application/.github/workflows/build.yml@refs/heads/main

      - name: Reject a different issuer
        id: wrong-issuer
        continue-on-error: true
        uses: $/actions/docker/verify-images
        with:
          images: ${{ steps.inspect-candidates.outputs.references }}
          certificate-identity-regexp: '^https://github\.com/hoverkraft-tech/ci-github-container/\.github/workflows/docker-build-images\.yml@.+$'
          certificate-oidc-issuer: https://untrusted-issuer.example.com

      - name: Assert verification output and policy failures
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED: ${{ steps.inspect-candidates.outputs.references }}
          VERIFIED: ${{ steps.verify-candidates.outputs.verified-images }}
          WRONG_SIGNER: ${{ steps.wrong-signer.outcome }}
          WRONG_SIGNER_IMAGES: ${{ steps.wrong-signer.outputs.verified-images }}
          WRONG_ISSUER: ${{ steps.wrong-issuer.outcome }}
          WRONG_ISSUER_IMAGES: ${{ steps.wrong-issuer.outputs.verified-images }}
        with:
          script: |
            const assert = require('node:assert/strict');
            assert.deepEqual(JSON.parse(process.env.VERIFIED), JSON.parse(process.env.EXPECTED));
            assert.equal(process.env.WRONG_SIGNER, 'failure');
            assert.equal(process.env.WRONG_SIGNER_IMAGES, '');
            assert.equal(process.env.WRONG_ISSUER, 'failure');
            assert.equal(process.env.WRONG_ISSUER_IMAGES, '');

  promote-candidates:
    name: Promote validated candidates
    needs: [act-candidates, assert-candidates]
    uses: $/.github/workflows/docker-promote-images.yml
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: write
      packages: write
      pull-requests: read
    with:
      job-results: ${{ toJSON(needs) }}
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  assert-promotion:
    name: Assert exact-digest promotion and retained security evidence
    needs: [act-candidates, promote-candidates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      validated-images: ${{ needs.act-candidates.outputs.built-images }}
    steps:
      - uses: $/actions/docker/setup
        with:
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
          setup-docker: false
          setup-buildx: false

      - id: inspect-promoted
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CANDIDATES: ${{ needs.act-candidates.outputs.built-images }}
          PROMOTED: ${{ needs.promote-candidates.outputs.built-images }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const candidates = JSON.parse(process.env.CANDIDATES);
            const promoted = JSON.parse(process.env.PROMOTED);
            assert.deepEqual(Object.keys(promoted).sort(), Object.keys(candidates).sort());
            for (const [name, candidate] of Object.entries(candidates)) {
              const image = promoted[name];
              assert.equal(image.digest, candidate.digest);
              assert.equal(image.candidate, undefined);
              assert.deepEqual(image.annotations, candidate.annotations);
              assert.deepEqual(image.platforms, candidate.platforms);
              assert.deepEqual(image.tags, ['1.2.3']);
              assert.deepEqual(image.images, candidate.candidate.destinations.map(tag => `${tag}@${candidate.digest}`));
              const reference = `${image.registry}/${image.repository}`;
              const before = await exec.getExecOutput('docker', ['buildx', 'imagetools', 'inspect', '--raw', `${reference}@${candidate.digest}`]);
              const after = await exec.getExecOutput('docker', ['buildx', 'imagetools', 'inspect', '--raw', `${reference}:1.2.3`]);
              assert.equal(after.stdout, before.stdout, 'Promotion must retain exact manifest bytes');
              await exec.exec('gh', ['attestation', 'verify', `oci://${image.images[0]}`, '--repo', process.env.GITHUB_REPOSITORY]);
            }
            core.setOutput('references', JSON.stringify(Object.values(promoted).flatMap(image => image.images)));

      - name: Verify retained image signatures
        uses: $/actions/docker/verify-images
        with:
          images: ${{ steps.inspect-promoted.outputs.references }}
          certificate-identity-regexp: '^https://github\.com/hoverkraft-tech/ci-github-container/\.github/workflows/docker-build-images\.yml@.+$'

  repeat-promotion:
    name: Repeat identical promotion
    needs: [act-candidates, assert-promotion]
    uses: $/.github/workflows/docker-promote-images.yml
    permissions:
      actions: read
      attestations: read
      contents: read
      deployments: write
      packages: write
      pull-requests: read
    with:
      job-results: ${{ toJSON(needs) }}
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

  assert-repeat-promotion:
    name: Assert idempotent promotion
    needs: [promote-candidates, repeat-promotion]
    runs-on: ubuntu-latest
    permissions:
      deployments: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FIRST: ${{ needs.promote-candidates.outputs.built-images }}
          SECOND: ${{ needs.repeat-promotion.outputs.built-images }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const images = JSON.parse(process.env.FIRST);
            assert.deepEqual(images, JSON.parse(process.env.SECOND));
            const destinations = Object.fromEntries(Object.values(images).flatMap(image =>
              image.tags.map(tag => [`${image.registry}/${image.repository}:${tag}`, image.digest])));
            const records = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment: 'ci-image-promotion', task: 'ci-image-promotion', per_page: 100,
            });
            const current = records.filter(record => record.payload?.runId === String(context.runId) && record.payload.attempt === process.env.GITHUB_RUN_ATTEMPT);
            assert.equal(current.length, 2, 'Both serialized promotion calls must retain their claims');
            for (const record of current) {
              assert.deepEqual(record.payload.destinations, destinations);
              assert.equal(record.payload.revision, context.sha);
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({ ...context.repo, deployment_id: record.id });
              assert.equal(statuses[0].state, 'success');
            }

  failed-candidate:
    name: Assert failed builds have no candidate output
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: failed-build
        continue-on-error: true
        uses: $/actions/docker/build-image
        with:
          image: test-candidate-${{ github.run_id }}-${{ github.run_attempt }}-failed
          dockerfile: tests/application/Dockerfile
          target: test
          platform: linux/amd64
          candidate: true
          tag: "1.2.3"
          cache-type: "false"
          # The existing test stage rejects missing mandatory build arguments.

      - name: Assert failure without outputs
        env:
          OUTCOME: ${{ steps.failed-build.outcome }}
          BUILT_IMAGE: ${{ steps.failed-build.outputs.built-image }}
        run: |
          test "$OUTCOME" = failure
          test -z "$BUILT_IMAGE"

  cleanup-candidates:
    name: Clean isolated candidate test packages and publication records
    if: always()
    needs:
      [
        act-candidates,
        assert-candidates,
        failed-candidate,
        promote-candidates,
        assert-promotion,
        repeat-promotion,
        assert-repeat-promotion,
      ]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      deployments: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const suffix of ['single', 'multi', 'failed']) {
              const name = `test-candidate-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-${suffix}`;
              try {
                await github.rest.packages.deletePackageForOrg({
                  package_type: 'container', package_name: `${context.repo.repo}/${name}`, org: context.repo.owner,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const records = await github.paginate(github.rest.repos.listDeployments, {
              ...context.repo, environment: 'ci-image-promotion', task: 'ci-image-promotion', per_page: 100,
            });
            const prefix = `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}/test-candidate-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}-`;
            for (const record of records) {
              const payload = record.payload;
              if (payload?.runId !== String(context.runId) || payload.attempt !== process.env.GITHUB_RUN_ATTEMPT) continue;
              const destinations = Object.keys(payload.destinations || {});
              if (!destinations.length || !destinations.every(destination => destination.startsWith(prefix))) continue;
              await github.rest.repos.createDeploymentStatus({ ...context.repo, deployment_id: record.id, state: 'inactive', auto_inactive: false });
              await github.rest.repos.deleteDeployment({ ...context.repo, deployment_id: record.id });
            }

# jscpd:ignore-end
