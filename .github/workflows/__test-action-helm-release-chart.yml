---
name: Test for "helm/release-chart" action
run-name: Test for "helm/release-chart" action

on: # yamllint disable-line rule:truthy
  workflow_call:

permissions: {}

jobs:
  continuous-integration:
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@a60704c5e9902675a1b4a5141411d95733e80ff5 # 3.0.2
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: actions/helm/release-chart
      build: ""
      lint: ""
      code-ql: '{"languages":"typescript","config-file":".github/codeql/config.yml"}'
      test: '{"comment":false,"report-group":"test-action-helm-release-chart"}'

  tests:
    name: Test for "helm/release-chart" action with simple chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        sign: [false, true]
        chart:
          - name: application
            values: |
              [
                { "path": ".image.registry", "value": "ghcr.io" },
                {
                  "path": ".image.repository",
                  "value": "hoverkraft-tech/ci-github-container/application"
                },
                { "path": ".image.tag", "value": "0.1.0" }
              ]
          - name: umbrella-application
            values: |
              [
                { "file": "charts/app/values.yaml", "path": ".image.registry", "value": "ghcr.io" },
                {
                  "file": "charts/app/values.yaml",
                  "path": ".image.repository",
                  "value": "hoverkraft-tech/ci-github-container/umbrella-application"
                },
                { "file": "charts/app/values.yaml", "path": ".image.tag", "value": "0.1.0" }
              ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arrange isolated chart version
        id: arrange
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SIGN: ${{ matrix.sign }}
        with:
          script: |
            // Different chart contents prevent an unsigned scenario from sharing a signed digest.
            core.setOutput('tag', `0.1.0-ci.${context.runId}.${process.env.GITHUB_RUN_ATTEMPT}.${process.env.SIGN}`);

      - id: release-chart
        uses: $/actions/helm/release-chart
        with:
          oci-registry: ghcr.io
          oci-registry-password: ${{ github.token }}
          chart: ${{ matrix.chart.name }}-test
          path: tests/charts/${{ matrix.chart.name }}
          values: ${{ matrix.chart.values }}
          tag: ${{ steps.arrange.outputs.tag }}
          sign: ${{ matrix.sign }}
          helm-repositories: |
            valkey https://valkey.io/valkey-helm/

      - name: Check release chart output
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASED_IMAGE: ${{ steps.release-chart.outputs.image }}
          RELEASED_DIGEST: ${{ steps.release-chart.outputs.digest }}
          RELEASED_IMAGE_DIGEST: ${{ steps.release-chart.outputs.image-digest }}
          CHART_NAME: ${{ matrix.chart.name }}
          CHART_TAG: ${{ steps.arrange.outputs.tag }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const image = `ghcr.io/${context.repo.owner}/${context.repo.repo}/charts/${process.env.CHART_NAME}-test/${context.repo.repo}`;
            assert.equal(process.env.RELEASED_IMAGE, `${image}:${process.env.CHART_TAG}`);
            assert.match(process.env.RELEASED_DIGEST, /^sha256:[a-f0-9]{64}$/);
            assert.equal(process.env.RELEASED_IMAGE_DIGEST, `${image}@${process.env.RELEASED_DIGEST}`);

      - name: Pull chart by immutable digest
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          RELEASED_IMAGE_DIGEST: ${{ steps.release-chart.outputs.image-digest }}
        with:
          script: |
            await exec.exec('helm', ['registry', 'login', '-u', process.env.REPOSITORY_OWNER, '--password-stdin', 'ghcr.io'], {
              input: Buffer.from(process.env.GH_TOKEN),
            });
            await exec.exec('helm', ['pull', `oci://${process.env.RELEASED_IMAGE_DIGEST}`]);

      - name: Authenticate Cosign for unsigned scenario verification
        if: ${{ !matrix.sign }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Verify chart signature
        id: verify-signature
        continue-on-error: ${{ !matrix.sign }}
        uses: $/actions/docker/verify-images
        with:
          images: ${{ steps.release-chart.outputs.image-digest }}
          certificate-identity: https://github.com/${{ github.repository }}/.github/workflows/__test-action-helm-release-chart.yml@${{ github.ref }}

      - name: Assert signature verification result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SIGN: ${{ matrix.sign }}
          OUTCOME: ${{ steps.verify-signature.outcome }}
          VERIFIED: ${{ steps.verify-signature.outputs.verified-images }}
          RELEASED_IMAGE_DIGEST: ${{ steps.release-chart.outputs.image-digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/__test-action-helm-release-chart.yml@${{ github.ref }}
        with:
          script: |
            const assert = require('node:assert/strict');
            if (process.env.SIGN === 'true') {
              assert.equal(process.env.OUTCOME, 'success');
              assert.deepEqual(JSON.parse(process.env.VERIFIED), [process.env.RELEASED_IMAGE_DIGEST]);
              return;
            }
            assert.equal(process.env.OUTCOME, 'failure');
            assert.equal(process.env.VERIFIED, '');
            // Independently confirm the failure is an unsigned chart, not a setup or network error.
            const result = await exec.getExecOutput('cosign', [
              'verify', '--certificate-oidc-issuer', 'https://token.actions.githubusercontent.com',
              '--certificate-identity', process.env.CERTIFICATE_IDENTITY, process.env.RELEASED_IMAGE_DIGEST,
            ], { ignoreReturnCode: true });
            assert.notEqual(result.exitCode, 0);
            assert.match(`${result.stderr}\n${result.stdout}`, /no signatures found|no valid bundles (?:found|exist)/i);

  default-signing:
    name: Release application (default sign=true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arrange isolated chart version
        id: arrange
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setOutput('tag', `0.1.0-ci.${context.runId}.${process.env.GITHUB_RUN_ATTEMPT}.default`);

      - id: release-chart
        uses: $/actions/helm/release-chart
        with:
          oci-registry: ghcr.io
          oci-registry-password: ${{ github.token }}
          chart: application-default-test
          path: tests/charts/application
          values: |
            [
              { "path": ".image.registry", "value": "ghcr.io" },
              {
                "path": ".image.repository",
                "value": "hoverkraft-tech/ci-github-container/application"
              },
              { "path": ".image.tag", "value": "0.1.0" }
            ]
          tag: ${{ steps.arrange.outputs.tag }}
          helm-repositories: |
            valkey https://valkey.io/valkey-helm/

      - name: Verify chart signature with default signing
        uses: $/actions/docker/verify-images
        with:
          images: ${{ steps.release-chart.outputs.image-digest }}
          certificate-identity: https://github.com/${{ github.repository }}/.github/workflows/__test-action-helm-release-chart.yml@${{ github.ref }}
