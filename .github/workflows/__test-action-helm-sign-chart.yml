---
name: Test for "helm/sign-chart" action
run-name: Test for "helm/sign-chart" action

on: # yamllint disable-line rule:truthy
  workflow_call:

permissions: {}

jobs:
  test:
    name: Test for "helm/sign-chart" action
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arrange isolated chart version
        id: arrange
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setOutput('tag', `0.1.0-ci.${context.runId}.${process.env.GITHUB_RUN_ATTEMPT}.sign-chart`);

      - id: release-chart
        uses: ./actions/helm/release-chart
        with:
          oci-registry: ghcr.io
          oci-registry-password: ${{ github.token }}
          chart: application-sign-chart-test
          path: tests/charts/application
          values: |
            [
              { "path": ".image.registry", "value": "ghcr.io" },
              {
                "path": ".image.repository",
                "value": "hoverkraft-tech/ci-github-container/application"
              },
              { "path": ".image.tag", "value": "0.1.0" }
            ]
          tag: ${{ steps.arrange.outputs.tag }}
          sign: "false"
          helm-repositories: |
            valkey https://valkey.io/valkey-helm/

      - name: Install Cosign for verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Authenticate Cosign for unsigned verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Assert chart is unsigned before signing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASED_IMAGE_DIGEST: ${{ steps.release-chart.outputs.image-digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/__test-action-helm-sign-chart.yml@${{ github.ref }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const result = await exec.getExecOutput('cosign', [
              'verify',
              '--certificate-oidc-issuer', 'https://token.actions.githubusercontent.com',
              '--certificate-identity', process.env.CERTIFICATE_IDENTITY,
              process.env.RELEASED_IMAGE_DIGEST,
            ], { ignoreReturnCode: true });

            const output = `${result.stderr}\n${result.stdout}`;
            assert.notEqual(result.exitCode, 0, 'Unsigned chart unexpectedly passed signature verification before helm/sign-chart');
            assert.match(output, /no signatures found|no valid bundles (?:found|exist)/i);

      - name: Act - Sign chart
        uses: ./actions/helm/sign-chart
        with:
          oci-registry: ghcr.io
          oci-registry-password: ${{ github.token }}
          charts: ${{ steps.release-chart.outputs.image }}@${{ steps.release-chart.outputs.digest }}

      - name: Assert chart signature exists after signing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASED_IMAGE_DIGEST: ${{ steps.release-chart.outputs.image-digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/__test-action-helm-sign-chart.yml@${{ github.ref }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const verify = (identity) => exec.getExecOutput('cosign', [
              'verify',
              '--certificate-oidc-issuer', 'https://token.actions.githubusercontent.com',
              '--certificate-identity', identity,
              process.env.RELEASED_IMAGE_DIGEST,
            ], { ignoreReturnCode: true });

            const result = await verify(process.env.CERTIFICATE_IDENTITY);
            const output = `${result.stderr}\n${result.stdout}`;
            assert.equal(result.exitCode, 0, `Chart signature verification failed: ${output}`);

            const wrongIdentity = await verify(`${process.env.CERTIFICATE_IDENTITY}-unexpected`);
            assert.notEqual(wrongIdentity.exitCode, 0, 'Signature verification accepted the wrong workflow identity');
            assert.match(`${wrongIdentity.stderr}\n${wrongIdentity.stdout}`, /identit(?:y|ies).*match|match.*identit(?:y|ies)/i);
