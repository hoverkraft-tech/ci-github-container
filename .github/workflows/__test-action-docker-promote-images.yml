---
name: Test for "docker/promote-images" action
run-name: Test for "docker/promote-images" action

on: # yamllint disable-line rule:truthy
  workflow_call:

permissions: {}

jobs:
  tests:
    name: Test promotion contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test actions/docker/promote-images/promote-images.test.js
