---
name: Internal - Common Continuous Integration tasks

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      CI_BOT_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  test-action-distributions:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/test-action-distributions.yml@0864018583d79f7e535f572005baa35f2e864849 # 4.1.0
    permissions:
      contents: read

  lint:
    name: linter
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@0864018583d79f7e535f572005baa35f2e864849 # 4.1.0
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      comment: false

  test-action-docker-promote-images:
    needs: lint
    uses: $/.github/workflows/__test-action-docker-promote-images.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  test-action-docker-verify-images:
    needs: lint
    uses: $/.github/workflows/__test-action-docker-verify-images.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  test-action-docker-build-image:
    needs: lint
    uses: $/.github/workflows/__test-action-docker-build-image.yml
    permissions:
      contents: read
      packages: write

  test-action-docker-create-images-manifests:
    needs: lint
    uses: $/.github/workflows/__test-action-docker-create-images-manifests.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read

  test-action-docker-setup:
    needs: lint
    uses: $/.github/workflows/__test-action-docker-setup.yml
    permissions:
      contents: read

  test-action-docker-prune-pull-requests-image-tags:
    needs: lint
    uses: $/.github/workflows/__test-action-docker-prune-pull-requests-image-tags.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read

  test-action-get-image-metadata:
    needs: lint
    uses: $/.github/workflows/__test-action-get-image-metadata.yml
    permissions:
      contents: read

  test-action-action-get-image-name:
    needs: lint
    uses: $/.github/workflows/__test-action-get-image-name.yml
    permissions:
      contents: read

  test-action-helm-parse-chart-uri:
    needs: lint
    uses: $/.github/workflows/__test-action-helm-parse-chart-uri.yml
    permissions:
      contents: read

  test-action-helm-sign-chart:
    needs: lint
    uses: $/.github/workflows/__test-action-helm-sign-chart.yml
    permissions:
      contents: read
      id-token: write
      packages: write

  test-action-helm-update-chart-values:
    needs: lint
    uses: $/.github/workflows/__test-action-helm-update-chart-values.yml
    permissions:
      contents: read

  test-action-helm-prepare-chart:
    needs: lint
    uses: $/.github/workflows/__test-action-helm-prepare-chart.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  test-action-helm-release-chart:
    needs: lint
    uses: $/.github/workflows/__test-action-helm-release-chart.yml
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: write
      security-events: write

  test-action-helm-test-chart:
    needs: lint
    uses: $/.github/workflows/__test-action-helm-test-chart.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read

  test-workflow-docker-build-images-building:
    name: Test docker build images - Building
    needs: lint
    uses: $/.github/workflows/__test-workflow-docker-build-images-building.yml
    permissions:
      attestations: write
      contents: read
      actions: read
      deployments: write
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      CI_BOT_APP_PRIVATE_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  test-workflow-docker-build-images-caching:
    name: Test docker build images - Caching
    needs: lint
    uses: $/.github/workflows/__test-workflow-docker-build-images-caching.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      CI_BOT_APP_PRIVATE_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  test-workflow-docker-build-images-multi-registry:
    name: Test docker build images - Multi registry inputs
    needs: lint
    uses: $/.github/workflows/__test-workflow-docker-build-images-multi-registry.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      CI_BOT_APP_PRIVATE_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  test-workflow-docker-build-images-platforms-and-signing:
    name: Test docker build images - Platforms and Signing
    needs: lint
    uses: $/.github/workflows/__test-workflow-docker-build-images-platforms-and-signing.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      CI_BOT_APP_PRIVATE_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  test-workflow-docker-build-images-attestation:
    name: Test docker build images - Attestation
    needs: lint
    uses: $/.github/workflows/__test-workflow-docker-build-images-attestation.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      CI_BOT_APP_PRIVATE_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  reports:
    needs:
      - lint
      - test-action-helm-prepare-chart
      - test-action-helm-release-chart
      - test-action-docker-promote-images
      - test-action-docker-verify-images
    if: always()
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@0864018583d79f7e535f572005baa35f2e864849 # 4.1.0
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
