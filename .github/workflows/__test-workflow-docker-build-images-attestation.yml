---
name: Test for "docker-build-images" workflow - Attestation
run-name: Test for "docker-build-images" workflow - Attestation

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      CI_BOT_APP_PRIVATE_KEY:
        required: false

permissions: {}

# jscpd:ignore-start
jobs:
  arrange:
    name: Arrange
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.define-matrix.outputs.result }}
    steps:
      - run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "GitHub token secret is not set"
            exit 1
          fi

      - id: define-matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: json
          script: |
            let imageNamePrefix;

            if (context.eventName === "pull_request") {
              const pullRequestNumber = context.payload.pull_request?.number;
              if (!pullRequestNumber) {
                throw new Error("Pull request number is not available in the event payload");
              }
              imageNamePrefix = `pr-${pullRequestNumber}`;
            } else {
              imageNamePrefix = process.env.GITHUB_REF_NAME;
              if (!imageNamePrefix) {
                throw new Error("GITHUB_REF_NAME environment variable is not set");
              }
            }

            imageNamePrefix = `test-${imageNamePrefix}-${context.runNumber}`.replace(/\//g, "-");

            const tag = '0.1.0';

            function createImageDefinition(name, platforms) {
              return {
                name,
                context: '.',
                dockerfile: './tests/application/Dockerfile',
                'build-args': { BUILD_RUN_ID: String(context.runId) },
                target: 'base',
                platforms,
                tag,
              };
            }

            function createScenario({ name, imageNames, platforms, attest }) {
              return {
                name,
                attest,
                images: JSON.stringify(imageNames.map(imageName => createImageDefinition(imageName, platforms))),
                verify_images: JSON.stringify(imageNames.map(imageName => `${imageName}:${tag}`)),
                package_names: JSON.stringify(imageNames),
              };
            }

            const matrix = {
              include: [
                createScenario({
                  name: 'mono-arch - attested',
                  imageNames: [`${imageNamePrefix}-mono-arch-attested`],
                  platforms: ['linux/amd64'],
                  attest: true,
                }),
                createScenario({
                  name: 'multi-arch - attested',
                  imageNames: [`${imageNamePrefix}-multi-arch-attested`],
                  platforms: ['linux/amd64', 'linux/arm64'],
                  attest: true,
                }),
                createScenario({
                  name: 'multiple images - attested',
                  imageNames: [
                    `${imageNamePrefix}-multi-image-attested-a`,
                    `${imageNamePrefix}-multi-image-attested-b`,
                  ],
                  platforms: ['linux/amd64'],
                  attest: true,
                }),
                createScenario({
                  name: 'mono-arch - not attested',
                  imageNames: [`${imageNamePrefix}-mono-arch-not-attested`],
                  platforms: ['linux/amd64'],
                  attest: false,
                }),
              ]
            };
            return matrix;

  act-build-images:
    name: Act - Build images (${{ matrix.name }})
    needs: arrange
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.arrange.outputs.matrix) }}
    uses: ./.github/workflows/docker-build-images.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
      build-secret-github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
    with:
      attest: ${{ matrix.attest }}
      sign: false
      images: ${{ matrix.images }}

  assert-images-attestation:
    name: Assert - Images attestation (${{ matrix.name }})
    needs: [arrange, act-build-images]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.arrange.outputs.matrix) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ./actions/docker/setup
        with:
          oci-registry: ghcr.io
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image attestation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SHOULD_HAVE_ATTESTATION: ${{ matrix.attest }}
          VERIFY_IMAGES_JSON: ${{ matrix.verify_images }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const shouldHaveAttestation = process.env.SHOULD_HAVE_ATTESTATION === 'true';
            const verifyImages = JSON.parse(process.env.VERIFY_IMAGES_JSON || '[]');
            const repo = 'hoverkraft-tech/ci-github-container';

            for (const imageName of verifyImages) {
              if (!imageName) {
                continue;
              }

              const args = [
                'attestation',
                'verify',
                `oci://ghcr.io/${repo}/${imageName}`,
                '--repo',
                repo,
              ];

              const result = await exec.getExecOutput('gh', args, {
                ignoreReturnCode: true,
              });

              if (result.stdout) {
                process.stdout.write(result.stdout);
              }

              if (result.stderr) {
                process.stderr.write(result.stderr);
              }

              if (shouldHaveAttestation) {
                console.log(`Verifying attestation for image: ${imageName}`);
                if (result.exitCode !== 0) {
                  throw new Error(`Attestation verification failed for ${imageName}`);
                }
                continue;
              }

              console.log(`Image ${imageName} should not have an attestation`);
              if (result.exitCode === 0) {
                core.setFailed(`Image ${imageName} should not be attested but attestation verification succeeded`);
                return;
              }

              console.log(`Attestation verification failed as expected for non-attested image ${imageName}`);
            }

  cleanup:
    name: Cleanup ephemeral test packages
    runs-on: ubuntu-latest
    if: always()
    needs:
      - arrange
      - assert-images-attestation
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.arrange.outputs.matrix) }}
    permissions:
      packages: write
    steps:
      - name: Delete test packages
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PACKAGE_NAMES_JSON: ${{ matrix.package_names }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const packageNames = JSON.parse(process.env.PACKAGE_NAMES_JSON || '[]');
            for (const packageName of packageNames) {
              await github.rest.packages.deletePackageForOrg({
                package_type: 'container',
                package_name: `ci-github-container/${packageName}`,
                org: 'hoverkraft-tech',
              });
            }

# jscpd:ignore-end
