---
name: Test for "docker/create-images-manifests" action
run-name: Test for "docker/create-images-manifests" action

on: # yamllint disable-line rule:truthy
  workflow_call:

permissions: {}

jobs:
  test-registry-retries:
    name: Assert - Registry visibility retries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test manifest creation and inspection retries
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const assert = require('node:assert/strict');
            const { stdout } = await exec.getExecOutput('ruby', [
              '-rjson', '-ryaml', '-e',
              'puts JSON.generate(YAML.safe_load(File.read(ARGV[0])))',
              'actions/docker/create-images-manifests/action.yml',
            ]);
            const action = JSON.parse(stdout);
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
            const digest = `sha256:${'a'.repeat(64)}`;
            const image = 'registry.example.com/test/application';
            const builtImages = {
              application: {
                name: 'application',
                registry: 'registry.example.com',
                repository: 'test/application',
                images: [`${image}@${digest}`],
                tags: ['test'],
                annotations: {},
                platforms: ['linux/amd64', 'linux/arm64'],
                'multi-platform': true,
              },
            };

            async function runStep(stepId, { visibleAfter = 0, error = 'manifest unknown' } = {}) {
              const creating = stepId === 'create-images-manifests';
              const input = structuredClone(builtImages);
              if (!creating) {
                input.application.images = [`${image}:test`];
              }
              const env = {
                [creating ? 'INPUT_BUILT_IMAGES' : 'BUILT_IMAGES_OUTPUT']: JSON.stringify(input),
              };
              const result = { calls: 0, elapsed: 0, delays: [], outputs: {} };
              const script = action.runs.steps.find(step => step.id === stepId).with.script;
              const execute = new AsyncFunction('process', 'core', 'exec', 'setTimeout', script);
              try {
                await execute(
                  { env },
                  {
                    debug() {},
                    info() {},
                    warning() {},
                    setOutput: (name, value) => { result.outputs[name] = JSON.parse(value); },
                  },
                  {
                    getExecOutput: async (command, args, options) => {
                      result.calls++;
                      assert.equal(command, 'docker');
                      assert.deepEqual(args.slice(0, 3), ['buildx', 'imagetools', creating ? 'create' : 'inspect']);
                      assert.equal(options.ignoreReturnCode, true);
                      assert(args.includes(creating ? `${image}@${digest}` : `${image}:test`));
                      return result.elapsed >= visibleAfter
                        ? { exitCode: 0, stdout: creating ? '' : `Digest: ${digest}`, stderr: '' }
                        : { exitCode: 1, stdout: '', stderr: error };
                    },
                  },
                  (callback, delay) => {
                    result.delays.push(delay);
                    result.elapsed += delay;
                    callback();
                  },
                );
              } catch (error) {
                result.error = error;
              }
              return result;
            }

            for (const stepId of ['create-images-manifests', 'get-built-images-digest']) {
              const ready = await runStep(stepId);
              assert.ifError(ready.error);
              assert.equal(ready.calls, 1);
              assert.deepEqual(ready.delays, []);

              for (const error of ['not found', 'manifest unknown', 'no such manifest']) {
                const delayed = await runStep(stepId, { visibleAfter: 90000, error });
                assert.ifError(delayed.error);
                assert(delayed.elapsed >= 90000 && delayed.elapsed <= 180000);
                const expectedImage = stepId === 'create-images-manifests' ? `${image}:test` : `${image}:test@${digest}`;
                assert.deepEqual(delayed.outputs['built-images'].application.images, [expectedImage]);
              }

              const missing = await runStep(stepId, { visibleAfter: Infinity });
              assert.match(missing.error?.message ?? '', /manifest unknown/);
              assert(missing.calls > 1 && missing.calls <= 6);
              assert(missing.elapsed <= 180000);
              assert.equal(missing.delays.length, missing.calls - 1);
              assert.deepEqual(missing.outputs, {});

              const denied = await runStep(stepId, { visibleAfter: Infinity, error: 'unauthorized' });
              assert.match(denied.error?.message ?? '', /unauthorized/);
              assert.equal(denied.calls, 1);
              assert.deepEqual(denied.delays, []);
              assert.deepEqual(denied.outputs, {});
            }

      - name: Test publication digests and mixed batches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const assert = require('node:assert/strict');
            const { stdout } = await exec.getExecOutput('ruby', [
              '-rjson', '-ryaml', '-e',
              'puts JSON.generate(YAML.safe_load(File.read(ARGV[0])))',
              'actions/docker/create-images-manifests/action.yml',
            ]);
            const action = JSON.parse(stdout);
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
            const sourceDigest = `sha256:${'a'.repeat(64)}`;
            const indexDigest = `sha256:${'b'.repeat(64)}`;
            const repository = 'registry.example.com/test/application';
            const single = {
              name: 'application', registry: 'registry.example.com', repository: 'test/application',
              images: [`${repository}@${sourceDigest}`], digest: sourceDigest,
              tags: ['test', 'latest'], annotations: { description: 'Application' },
              platforms: ['linux/amd64'], 'multi-platform': false,
            };

            async function publish(input) {
              const calls = [];
              let images = JSON.stringify(input);
              let requiresBuildx;
              for (const stepId of ['prepare-images', 'create-images-manifests', 'get-built-images-digest']) {
                const script = action.runs.steps.find(step => step.id === stepId).with.script;
                await new AsyncFunction('process', 'core', 'exec', script)(
                  { env: { INPUT_BUILT_IMAGES: images, BUILT_IMAGES_OUTPUT: images } },
                  {
                    debug() {}, info() {},
                    setOutput(name, value) {
                      if (name === 'built-images') images = value;
                      if (name === 'requires-buildx') requiresBuildx = value;
                    },
                  },
                  { getExecOutput: async (command, args) => {
                    calls.push([command, ...args]);
                    return { exitCode: 0, stdout: `Digest: ${indexDigest}`, stderr: '' };
                  } },
                );
              }
              return { images: JSON.parse(images), calls, requiresBuildx };
            }

            const reused = await publish({ application: single });
            assert.equal(reused.requiresBuildx, 'false');
            assert.deepEqual(reused.calls, []);
            assert.deepEqual(reused.images.application, {
              ...single, images: single.tags.map(tag => `${repository}:${tag}@${sourceDigest}`),
            });

            const withoutDigest = { ...single };
            delete withoutDigest.digest;
            assert.deepEqual((await publish({ application: withoutDigest })).images, reused.images);
            const taggedSource = { ...single, images: [`${repository}:test@${sourceDigest}`] };
            assert.deepEqual((await publish({ application: taggedSource })).images, reused.images);

            const multi = {
              ...single, name: 'multi', 'multi-platform': true,
              platforms: ['linux/amd64', 'linux/arm64'],
              images: [`${repository}@${sourceDigest}`, `${repository}@${indexDigest}`],
            };
            const mixed = await publish({ application: single, multi });
            assert.equal(mixed.requiresBuildx, 'true');
            assert.deepEqual(Object.keys(mixed.images), ['application', 'multi']);
            assert.deepEqual(mixed.images.application, reused.images.application);
            assert.deepEqual(mixed.images.multi, {
              ...multi, digest: indexDigest,
              images: single.tags.map(tag => `${repository}:${tag}@${indexDigest}`),
            });
            assert.deepEqual(mixed.calls.map(call => call.slice(0, 4)), [
              ['docker', 'buildx', 'imagetools', 'create'],
              ['docker', 'buildx', 'imagetools', 'inspect'],
            ]);

            const tagOnly = await publish({ application: { ...single, images: [`${repository}:test`] } });
            assert.equal(tagOnly.requiresBuildx, 'true');
            assert.equal(tagOnly.images.application.digest, indexDigest);
            assert.deepEqual(tagOnly.calls, [['docker', 'buildx', 'imagetools', 'inspect', `${repository}:test`]]);
            const clone = await publish({ application: { ...single, 'multi-platform': true } });
            assert.equal(clone.images.application.digest, indexDigest);
            assert.equal(clone.calls.length, 2);

            for (const invalid of [null, [], { application: null }, { application: { ...single, images: [] } }]) {
              await assert.rejects(publish(invalid));
            }
            await assert.rejects(publish({ application: { ...single, digest: indexDigest } }), /Conflicting digest/);
            for (const source of [`other.example.com/test/application@${sourceDigest}`, `${repository}@sha256:invalid`]) {
              await assert.rejects(publish({ application: { ...single, images: [source] } }), /Invalid immutable source/);
            }

  build-original-tag:
    name: Arrange - Build original tag
    uses: $/.github/workflows/docker-build-images.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
    with:
      sign: false
      images: |
        [
          {
            "name": "test-create-manifests-clone-tag",
            "context": ".",
            "dockerfile": "./tests/application/Dockerfile",
            "target": "prod",
            "platforms": ["linux/amd64"],
            "tag": "1.0.0-rc.0"
          }
        ]

  clone-tag:
    name: Act/Assert - Clone 1.0.0-rc.0 to 1.0.0
    needs: build-original-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/actions/docker/setup
        with:
          oci-registry: ghcr.io
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - id: create-images-manifests-input
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILT_IMAGES_OUTPUT: ${{ needs.build-original-tag.outputs.built-images }}
        with:
          script: |
            const builtImages = JSON.parse(process.env.BUILT_IMAGES_OUTPUT);

            const imageName = "test-create-manifests-clone-tag";
            const originalImage = builtImages[imageName];
            if (!originalImage) {
              throw new Error(`Missing "${imageName}" entry in "built-images" output`);
            }

            const cloneInput = {
              [imageName]: {
                ...originalImage,
                tags: ["1.0.0"],
                images: [`${originalImage.registry}/${originalImage.repository}:1.0.0-rc.0`],
                "multi-platform": true, // Force multi-platform to force create tag
              },
            };

            core.setOutput("built-images", JSON.stringify(cloneInput));

      - id: clone-tag
        uses: $/actions/docker/create-images-manifests
        with:
          oci-registry: ghcr.io
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
          built-images: ${{ steps.create-images-manifests-input.outputs.built-images }}

      - name: Assert - Cloned tag exists in registry
        run: |
          docker manifest inspect ghcr.io/hoverkraft-tech/ci-github-container/test-create-manifests-clone-tag:1.0.0 >/dev/null

      - name: Assert - Cloned image digest and tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ORIGINAL_BUILT_IMAGES_OUTPUT: ${{ needs.build-original-tag.outputs.built-images }}
          CLONED_BUILT_IMAGES_OUTPUT: ${{ steps.clone-tag.outputs.built-images }}
        with:
          script: |
            const assert = require("assert");

            const imageName = "test-create-manifests-clone-tag";

            const originalBuiltImages = JSON.parse(process.env.ORIGINAL_BUILT_IMAGES_OUTPUT);
            const clonedBuiltImages = JSON.parse(process.env.CLONED_BUILT_IMAGES_OUTPUT);

            const originalImage = originalBuiltImages[imageName];
            const clonedImage = clonedBuiltImages[imageName];

            assert(originalImage, `Missing "${imageName}" in original built-images output`);
            assert(clonedImage, `Missing "${imageName}" in cloned built-images output`);

            assert.equal(clonedImage.tags.length, 1, `Expected one cloned tag for "${imageName}"`);
            assert.equal(clonedImage.tags[0], "1.0.0", `Unexpected cloned tag for "${imageName}"`);

            assert.match(originalImage.digest, /^sha256:[a-f0-9]{64}$/, `Invalid original digest format for "${imageName}"`);
            assert.match(clonedImage.digest, /^sha256:[a-f0-9]{64}$/, `Invalid digest format for "${imageName}"`);

            const expectedClonedImage = `${clonedImage.registry}/${clonedImage.repository}:1.0.0@${clonedImage.digest}`;
            assert(
              clonedImage.images.includes(expectedClonedImage),
              `Expected cloned image reference not found: ${expectedClonedImage}`,
            );
