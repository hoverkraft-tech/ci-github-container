# Mirror a validated immutable image to another registry without rebuilding it.
# Require successful source validation or promotion through the calling job's needs.
# Pass a digest-qualified source and one explicit destination tag. The workflow
# serializes writes to that destination and returns its verified immutable reference.
# It preserves image manifests and indexes, but does not copy separate signatures
# or referrers. Source validation remains the caller's responsibility.
#
# Registry credentials are supplied as secrets. The GitHub job token is used only
# for ghcr.io sources; other private source registries require explicit credentials.
# No credentials are needed to read public source registries. An optional environment
# protects registry publication. No source checkout or application build is performed.
---
name: Docker mirror image
"on":
  workflow_call:
    inputs:
      source-image:
        description: Validated source image including an immutable SHA-256 digest.
        type: string
        required: true
      destination-image:
        description: Destination registry, repository and explicit tag.
        type: string
        required: true
      source-registry-username:
        description: Source registry username. Defaults to the GitHub actor for ghcr.io.
        type: string
        default: ""
      destination-registry-username:
        description: Destination registry username. Use the secret when sensitive.
        type: string
        default: ""
      environment:
        description: Optional GitHub environment protecting destination publication.
        type: string
        default: ""
    secrets:
      source-registry-username:
        description: Optional private source registry username; overrides the input.
        required: false
      source-registry-password:
        description: Source credential. Defaults to the job token only for ghcr.io sources.
        required: false
      destination-registry-username:
        description: Optional private destination registry username; overrides the input.
        required: false
      destination-registry-password:
        description: Credential authorized to publish the destination image.
        required: true
    outputs:
      image:
        description: Published destination qualified by the unchanged source digest.
        value: ${{ jobs.mirror.outputs.image }}
permissions: {}
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    concurrency:
      group: image-mirror-${{ github.repository_id }}-${{ inputs.destination-image }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.mirror.outputs.image }}
    steps:
      - id: mirror
        uses: $/actions/docker/mirror-image
        with:
          source-image: ${{ inputs.source-image }}
          destination-image: ${{ inputs.destination-image }}
          source-registry-username: >-
            ${{ secrets.source-registry-username || inputs.source-registry-username ||
            (startsWith(inputs.source-image, 'ghcr.io/') && github.actor) || '' }}
          source-registry-password: ${{ secrets.source-registry-password || (startsWith(inputs.source-image, 'ghcr.io/') && github.token) || '' }}
          destination-registry-username: ${{ secrets.destination-registry-username || inputs.destination-registry-username }}
          destination-registry-password: ${{ secrets.destination-registry-password }}
