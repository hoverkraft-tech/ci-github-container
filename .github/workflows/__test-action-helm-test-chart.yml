---
name: Test for "helm/test-chart" action
run-name: Test for "helm/test-chart" action

on: # yamllint disable-line rule:truthy
  workflow_call:

permissions: {}

jobs:
  build-test-images:
    uses: $/.github/workflows/docker-build-images.yml
    permissions:
      attestations: write
      contents: read
      id-token: write
      issues: read
      packages: write
      pull-requests: read
    secrets:
      oci-registry-password: ${{ secrets.GITHUB_TOKEN }}
    with:
      sign: false
      images: |
        [
          {
            "name": "application-test",
            "context": ".",
            "dockerfile": "./tests/application/Dockerfile",
            "target": "prod",
            "platforms": ["linux/amd64"],
            "tag": "0.1.0"
          }
        ]

  test-install:
    name: Test for "helm/test-chart" action
    needs: build-test-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arrange standalone test action
        run: |
          mkdir -p .cache/agent-work
          cp -R actions/helm/test-chart .cache/agent-work/test-chart

      - id: test-chart
        # This runner-created copy is the isolation test target.
        uses: ./.cache/agent-work/test-chart # zizmor: ignore[self-repository]
        with:
          check-diff-only: false
          namespace: chart-testing
          helm-set: |
            image.tag=${{ fromJson(needs.build-test-images.outputs.built-images).application-test.tags[0] }}
            image.digest=${{ fromJson(needs.build-test-images.outputs.built-images).application-test.digest }}
          helm-repositories: |
            valkey https://valkey.io/valkey-helm/
          oci-registry: ghcr.io
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ secrets.GITHUB_TOKEN }}

      # The action's checkout can remove the fixture. Post-job hooks reload its manifest.
      # Keep this copy until the hosted runner disposes of the workspace after those hooks.
      - name: Restore standalone action for post-job hooks
        if: always()
        run: |
          mkdir -p .cache/agent-work/test-chart
          cp actions/helm/test-chart/action.yml .cache/agent-work/test-chart/action.yml
