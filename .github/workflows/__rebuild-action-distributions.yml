name: Internal - Rebuild action distributions

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  distributions:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/action-distributions.yml@0864018583d79f7e535f572005baa35f2e864849 # 4.1.0
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      pull-request-authors: |
        ["dependabot", "renovate", {"login":"hoverkraft-bot[bot]","id":128996893,"branch-prefix":"renovate/"}]
