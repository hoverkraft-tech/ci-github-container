name: Internal - Rebuild action distributions

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  distributions:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/action-distributions.yml@2fa562bd44f9e752a99a374c85ae14644e7f2bdd # 4.2.2
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      pull-request-authors: |
        ["dependabot", "renovate", {"login":"hoverkraft-bot[bot]","id":128996893,"branch-prefix":"renovate/"}]
