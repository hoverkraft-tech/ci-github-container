name: Internal - Rebuild action distributions

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  distributions:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/action-distributions.yml@d606f77fad305ef07dfde3db5270f5e324019c97 # 4.2.4
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      pull-request-authors: |
        ["dependabot", "renovate", {"login":"hoverkraft-bot[bot]","id":128996893,"branch-prefix":"renovate/"}]
