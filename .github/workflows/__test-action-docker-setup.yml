---
name: Test for "docker/setup" action
run-name: Test for "docker/setup" action

on: # yamllint disable-line rule:truthy
  workflow_call:

permissions: {}

jobs:
  tests-registry-only:
    name: Test registry authentication without a Docker daemon
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_HOST: unix:///tmp/ci-github-container-no-daemon.sock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Act - Authenticate without initializing Docker or Buildx
        id: registry-only
        uses: $/actions/docker/setup
        with:
          oci-registry: ghcr.io
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ github.token }}
          setup-docker: false
          setup-buildx: false
          docker-version: "0.0.0"

      - name: Assert - Docker detection and Buildx driver contracts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const assert = require('node:assert/strict');
            const { stdout } = await exec.getExecOutput('ruby', [
              '-rjson', '-ryaml', '-e',
              'puts JSON.generate(YAML.safe_load(File.read(ARGV[0])))',
              'actions/docker/setup/action.yml',
            ]);
            const action = JSON.parse(stdout);
            const script = action.runs.steps.find(step => step.id === 'detect-docker').with.script;
            const AsyncFunction = Object.getPrototypeOf(async function () {}).constructor;
            for (const dockerPath of ['/usr/bin/docker', '']) {
              const outputs = {};
              await new AsyncFunction('process', 'io', 'core', 'exec', script)(
                { env: { SETUP_DOCKER: 'false', EXPECTED_DOCKER_VERSION: 'test-version' } },
                { which: async () => dockerPath },
                { info() {}, setOutput: (name, value) => { outputs[name] = value; } },
                { getExecOutput: async () => { assert.fail('Registry-only setup must not contact the daemon'); } },
              );
              assert.deepEqual(outputs, dockerPath ? {} : { 'docker-install-version': 'test-version' });
            }

            const prepareBuildx = action.runs.steps.find(step => step.id === 'prepare-buildx').with.script;
            for (const driver of ['docker', 'docker-container', 'unsupported']) {
              const commands = [];
              const prepare = () => new AsyncFunction('process', 'core', 'exec', prepareBuildx)(
                { env: { BUILDX_DRIVER: driver, BUILDKIT_IMAGE_INPUT: 'test-buildkit-image' } },
                { info() {} },
                { getExecOutput: async (...args) => { commands.push(args.slice(0, 2)); return { exitCode: 0 }; } },
              );
              if (driver === 'unsupported') {
                await assert.rejects(prepare, /"buildx-driver" must be/);
                assert.deepEqual(commands, []);
              } else {
                await prepare();
                assert.deepEqual(commands, driver === 'docker' ? [] : [['docker', ['pull', 'test-buildkit-image']]]);
              }
            }

      - name: Assert - Registry-only outputs
        env:
          PUSH_REGISTRY: ${{ steps.registry-only.outputs.push-registry }}
          BUILDX_NAME: ${{ steps.registry-only.outputs.buildx-name }}
        run: |
          test "$PUSH_REGISTRY" = "ghcr.io"
          test -z "$BUILDX_NAME"
          if docker info >/dev/null 2>&1; then
            echo "::error::Test requires an unreachable Docker daemon"
            exit 1
          fi

      - name: Act - Reject invalid registry credentials
        id: denied
        continue-on-error: true
        uses: $/actions/docker/setup
        with:
          oci-registry: ghcr.io
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: invalid-test-credential
          setup-docker: false
          setup-buildx: false

      - name: Assert - Authentication failure propagates
        env:
          LOGIN_OUTCOME: ${{ steps.denied.outcome }}
        run: test "$LOGIN_OUTCOME" = "failure"

  tests:
    name: Test for "docker/setup" action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Arrange - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arrange - Resolve the required Docker version
        id: resolve-docker-version
        shell: bash
        run: |
          docker_version="$(ruby -e 'require "yaml"; puts YAML.safe_load(File.read("actions/docker/setup/action.yml")).dig("inputs", "docker-version", "default")')"

          if [ -z "$docker_version" ]; then
            echo "Failed to resolve docker-version default from actions/docker/setup/action.yml"
            exit 1
          fi

          echo "docker-version=$docker_version" >> "$GITHUB_OUTPUT"

      - name: Act - Setup Docker with defaults
        id: docker-setup
        uses: $/actions/docker/setup
        with:
          oci-registry: ghcr.io
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ github.token }}

      - name: Act - Reuse pinned Docker with multiple registries and no Buildx
        id: docker-setup-without-buildx
        uses: $/actions/docker/setup
        with:
          oci-registry: |
            {"pull":"docker.io","pull:private":"ghcr.io","push":"ghcr.io"}
          oci-registry-username: |
            {"push":"${{ github.repository_owner }}"}
          oci-registry-password: |
            {"push":"${{ github.token }}"}
          setup-buildx: false

      - name: Assert - Check setup outputs and installed tooling
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_DOCKER_VERSION: ${{ steps.resolve-docker-version.outputs.docker-version }}
          DEFAULT_PUSH_REGISTRY: ${{ steps.docker-setup.outputs.push-registry }}
          DEFAULT_CACHE_REGISTRY: ${{ steps.docker-setup.outputs.cache-registry }}
          DEFAULT_PULL_REGISTRIES: ${{ steps.docker-setup.outputs.pull-registries }}
          DEFAULT_BUILDX_NAME: ${{ steps.docker-setup.outputs.buildx-name }}
          MULTI_PUSH_REGISTRY: ${{ steps.docker-setup-without-buildx.outputs.push-registry }}
          MULTI_CACHE_REGISTRY: ${{ steps.docker-setup-without-buildx.outputs.cache-registry }}
          MULTI_PULL_REGISTRIES: ${{ steps.docker-setup-without-buildx.outputs.pull-registries }}
          MULTI_BUILDX_NAME: ${{ steps.docker-setup-without-buildx.outputs.buildx-name }}
        with:
          script: |
            const assert = require("assert");

            function parseJson(label, value) {
              try {
                return JSON.parse(value);
              } catch (error) {
                assert.fail(`Failed to parse ${label}: ${error}`);
              }
            }

            assert.equal(process.env.DEFAULT_PUSH_REGISTRY, "ghcr.io", 'Default "push-registry" output is not valid');
            assert.equal(process.env.DEFAULT_CACHE_REGISTRY, "ghcr.io", 'Default "cache-registry" output is not valid');
            assert.deepEqual(
              parseJson('default "pull-registries" output', process.env.DEFAULT_PULL_REGISTRIES),
              ["ghcr.io"],
              'Default "pull-registries" output is not valid',
            );

            assert.equal(process.env.MULTI_PUSH_REGISTRY, "ghcr.io", 'Multi-registry "push-registry" output is not valid');
            assert.equal(process.env.MULTI_CACHE_REGISTRY, "ghcr.io", 'Multi-registry "cache-registry" output is not valid');
            assert.deepEqual(
              parseJson('multi-registry "pull-registries" output', process.env.MULTI_PULL_REGISTRIES),
              ["docker.io", "ghcr.io"],
              'Multi-registry "pull-registries" output is not valid',
            );
            assert.equal(
              `${process.env.MULTI_BUILDX_NAME || ''}`.trim(),
              '',
              '"buildx-name" output must be empty when Buildx is disabled',
            );

            const expectedDockerVersion = process.env.EXPECTED_DOCKER_VERSION;
            const dockerVersionResult = await exec.getExecOutput(
              "docker",
              ["version", "--format", "{{.Client.Version}}|{{.Server.Version}}"],
              { silent: true },
            );
            assert.deepEqual(
              dockerVersionResult.stdout.trim().split('|'),
              [expectedDockerVersion, expectedDockerVersion],
              'Docker client and daemon do not use the expected pinned version',
            );

            const buildxName = `${process.env.DEFAULT_BUILDX_NAME || ''}`.trim();
            assert(buildxName.length, 'Default "buildx-name" output is empty');

            const dockerContextResult = await exec.getExecOutput(
              "docker",
              ["context", "inspect", "--format", "{{ (index .Endpoints \"docker\").Host }}"],
              { silent: true },
            );
            const expectedDockerEndpoint = dockerContextResult.stdout.trim();
            assert(expectedDockerEndpoint.length, 'Failed to resolve current Docker context endpoint');

            const buildxListResult = await exec.getExecOutput(
              "docker",
              ["buildx", "ls", "--format", "json"],
              { ignoreReturnCode: true, silent: true },
            );
            assert.equal(
              buildxListResult.exitCode,
              0,
              `Failed to list Buildx builders: ${buildxListResult.stderr || 'unknown error'}`,
            );

            const buildxBuilders = buildxListResult.stdout
              .split(/\r?\n/)
              .map(line => line.trim())
              .filter(Boolean)
              .map(line => parseJson('Buildx builder', line));
            const buildxBuilder = buildxBuilders.find(builder => builder.Name === buildxName);
            assert(buildxBuilder, `Configured Buildx builder "${buildxName}" is not listed`);

            const buildxNodes = buildxBuilder.Nodes;
            assert(Array.isArray(buildxNodes) && buildxNodes.length > 0, 'Buildx nodes output is empty');

            const buildxNode = buildxNodes.find(node => node.Endpoint === expectedDockerEndpoint);
            assert(buildxNode, 'Configured Buildx builder is not attached to the current Docker context endpoint');
            assert.equal(buildxNode.Status, 'running', 'Configured Buildx node is not running');

      - name: Arrange - Record existing containers
        id: containers-before
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { stdout } = await exec.getExecOutput('docker', ['ps', '-aq']);
            core.setOutput('ids', JSON.stringify(stdout.trim().split(/\s+/).filter(Boolean).sort()));

      - name: Act - Setup Buildx with the Docker driver
        id: docker-driver
        uses: $/actions/docker/setup
        with:
          oci-registry: ghcr.io
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ github.token }}
          setup-docker: false
          buildx-driver: docker
          # These settings must be ignored when reusing the Docker daemon's builder.
          docker-version: "0.0.0"
          buildkit-image: invalid-buildkit-image-for-docker-driver
          buildkitd-config-inline: invalid-buildkit-config-for-docker-driver

      - name: Assert - Docker driver reuses the daemon without creating containers
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILDX_NAME: ${{ steps.docker-driver.outputs.buildx-name }}
          PUSH_REGISTRY: ${{ steps.docker-driver.outputs.push-registry }}
          CONTAINERS_BEFORE: ${{ steps.containers-before.outputs.ids }}
          EXPECTED_DOCKER_VERSION: ${{ steps.resolve-docker-version.outputs.docker-version }}
        with:
          script: |
            const assert = require('node:assert/strict');
            assert.equal(process.env.PUSH_REGISTRY, 'ghcr.io');
            const { stdout: builders } = await exec.getExecOutput('docker', ['buildx', 'ls', '--format', 'json']);
            const builder = builders.trim().split(/\r?\n/).map(line => JSON.parse(line)).find(item => item.Name === process.env.BUILDX_NAME);
            assert.equal(builder?.Driver, 'docker');
            const { stdout: containers } = await exec.getExecOutput('docker', ['ps', '-aq']);
            assert.deepEqual(containers.trim().split(/\s+/).filter(Boolean).sort(), JSON.parse(process.env.CONTAINERS_BEFORE));
            const { stdout: version } = await exec.getExecOutput('docker', ['version', '--format', '{{.Client.Version}}|{{.Server.Version}}']);
            assert.deepEqual(version.trim().split('|'), [process.env.EXPECTED_DOCKER_VERSION, process.env.EXPECTED_DOCKER_VERSION]);

  tests-external-docker-daemon:
    name: Test for "docker/setup" action with an externally managed Docker daemon
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - name: Arrange - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arrange - Resolve the Docker version provided by the runner
        id: resolve-docker-version
        shell: bash
        run: |
          echo "docker-version=$(docker version --format '{{.Client.Version}}|{{.Server.Version}}')" >> "$GITHUB_OUTPUT"

      - name: Act - Setup Docker
        id: docker-setup
        uses: $/actions/docker/setup
        with:
          oci-registry: ghcr.io
          oci-registry-username: ${{ github.repository_owner }}
          oci-registry-password: ${{ github.token }}
          # Not a Docker release: it never matches the versions provided by the runner, and installing it fails.
          # Only the DOCKER_HOST guard can make this step succeed.
          docker-version: "0.0.0"

      - name: Assert - Check that the Docker daemon is kept
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_DOCKER_VERSION: ${{ steps.resolve-docker-version.outputs.docker-version }}
          BUILDX_NAME: ${{ steps.docker-setup.outputs.buildx-name }}
        with:
          script: |
            const assert = require("assert");

            const dockerVersionResult = await exec.getExecOutput(
              "docker",
              ["version", "--format", "{{.Client.Version}}|{{.Server.Version}}"],
              { silent: true },
            );
            assert.equal(
              dockerVersionResult.stdout.trim(),
              process.env.EXPECTED_DOCKER_VERSION,
              'Docker client and daemon provided by the runner must be kept',
            );

            assert(`${process.env.BUILDX_NAME || ''}`.trim().length, '"buildx-name" output is empty');
