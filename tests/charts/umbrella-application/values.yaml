# !!! this is an umbrella chart !!!
# the only values that should be defined must be under the 'global' key
# we also use components key to conditionally include dependencies (check Chart.yaml)
---
global:
  nameOverride: ""
  fullnameOverride: ""

# components

app:
  enabled: true

database:
  enabled: true
  fullnameOverride: database
  namespaceOverride: app-system
  existingConfigmap: database-custom-config
  auth:
    enabled: false
  image:
    pullPolicy: Always
    tag: "9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd"
  podSecurityContext:
    fsGroup: 10001
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  initResources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  readinessProbe:
    enabled: true
  networkPolicy:
    ingress:
      - from:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: app
        ports:
          - protocol: TCP
            port: 6379
