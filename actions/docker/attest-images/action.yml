---
name: "Docker - Attest images"
description: |
  Action to generate build provenance attestations for OCI images.
  It uses [actions/attest](https://github.com/actions/attest) to create SLSA provenance attestations.
  Attestations are published to the GitHub Attestations API and optionally pushed to the image registry.
  The images must be identified by immutable digest references in the format `registry/name:tag@digest`.
  Images sharing the same `registry/name` and digest are deduplicated — only one attestation is
  created per unique subject.

  Note: this action complements, and does not replace, image signing with cosign.
  See [sign-images](../sign-images/README.md) for registry-native image signing.

author: hoverkraft
branding:
  icon: shield
  color: blue

inputs:
  images:
    description: |
      Images to attest.
      Can be a single image or a list of images separated by commas or newlines or spaces.
      The images should be in the format `registry/name:tag@digest`.
      It can also be a list of images in JSON format.
      Example:

      ```json
      [
        "ghcr.io/my-org/my-repo/application:pr-63-5222075@sha256:d31aa93410434ac9dcfc9179cac2cb1fd4d7c27f11527addc40299c7c675f49d",
        "ghcr.io/my-org/my-repo/application:pr-63@sha256:0f5aa93410434ac9dcfc9179cac2cb1fd4d7c27f11527addc40299c7c675f402"
      ]
      ```

      Multiple images sharing the same `registry/name` and digest are deduplicated —
      only one attestation is created per unique subject (up to 5 unique subjects).
    required: true
  push-to-registry:
    description: |
      Whether to push the attestation to the image registry.
      When enabled, the attestation is stored as an OCI artifact alongside the image.
      Requires the registry to support OCI artifact storage.
    default: "true"
  github-token:
    description: |
      GitHub Token used to create attestations.
      Permissions:
      - `id-token`: `write`
      - `attestations`: `write`
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - id: extract-subjects
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        INPUT_IMAGES: ${{ inputs.images }}
      with:
        script: |
          const imagesInput = process.env.INPUT_IMAGES || "";
          let images = null;
          try {
            // Try to parse the input as JSON
            images = JSON.parse(imagesInput);
          } catch (error) {
            // If it fails, split the input by commas, newlines or spaces
            images = imagesInput.split(/[\s,]+/).filter(image => image.trim() !== "");
          }

          if (!Array.isArray(images) || images.length === 0) {
            return core.setFailed(`"images" input is not a valid JSON array or a non-empty string: ${images}`);
          }

          // Ensure images are in the correct format
          const registryPart = String.raw`(?<registry>[a-zA-Z0-9._-]+(?:\.[a-zA-Z0-9._-]+)*(?::[0-9]+)?)`;
          const repositoryPart = String.raw`(?<repository>[a-z0-9._\/-]+)`;
          const tagPart = String.raw`(?<tag>[a-zA-Z0-9._-]+)`;
          const digestPart = String.raw`(?<digest>sha256:[a-f0-9]{64})`;
          const imageRegex = new RegExp(`^${registryPart}/${repositoryPart}:${tagPart}@${digestPart}$`);

          const MAX_SUBJECTS = 5;
          const subjectMap = new Map();

          for (const image of images) {
            if (typeof image !== 'string') {
              return core.setFailed(`Invalid image format: ${image}. Expected a string.`);
            }

            const match = image.match(imageRegex);
            if (!match || !match.groups) {
              return core.setFailed(`Invalid image format: ${image}. Expected format: registry/name:tag@digest`);
            }

            const { registry, repository, digest } = match.groups;
            const subjectName = `${registry}/${repository}`;
            const key = `${subjectName}@${digest}`;

            if (!subjectMap.has(key)) {
              subjectMap.set(key, { subjectName, subjectDigest: digest });
            }
          }

          const subjects = Array.from(subjectMap.values());

          if (subjects.length > MAX_SUBJECTS) {
            core.warning(
              `Found ${subjects.length} unique image subjects but only ${MAX_SUBJECTS} will be attested. ` +
              `Consider calling this action separately for each image.`
            );
          }

          const attested = subjects.slice(0, MAX_SUBJECTS);
          attested.forEach((subject, index) => {
            core.setOutput(`subject-${index}-name`, subject.subjectName);
            core.setOutput(`subject-${index}-digest`, subject.subjectDigest);
          });

          core.setOutput('subject-count', String(attested.length));
          core.debug(`Extracted ${attested.length} unique subject(s) for attestation`);

    - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
      if: steps.extract-subjects.outputs['subject-0-name'] != ''
      with:
        subject-name: ${{ steps.extract-subjects.outputs['subject-0-name'] }}
        subject-digest: ${{ steps.extract-subjects.outputs['subject-0-digest'] }}
        push-to-registry: ${{ inputs.push-to-registry }}
        github-token: ${{ inputs.github-token }}

    - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
      if: steps.extract-subjects.outputs['subject-1-name'] != ''
      with:
        subject-name: ${{ steps.extract-subjects.outputs['subject-1-name'] }}
        subject-digest: ${{ steps.extract-subjects.outputs['subject-1-digest'] }}
        push-to-registry: ${{ inputs.push-to-registry }}
        github-token: ${{ inputs.github-token }}

    - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
      if: steps.extract-subjects.outputs['subject-2-name'] != ''
      with:
        subject-name: ${{ steps.extract-subjects.outputs['subject-2-name'] }}
        subject-digest: ${{ steps.extract-subjects.outputs['subject-2-digest'] }}
        push-to-registry: ${{ inputs.push-to-registry }}
        github-token: ${{ inputs.github-token }}

    - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
      if: steps.extract-subjects.outputs['subject-3-name'] != ''
      with:
        subject-name: ${{ steps.extract-subjects.outputs['subject-3-name'] }}
        subject-digest: ${{ steps.extract-subjects.outputs['subject-3-digest'] }}
        push-to-registry: ${{ inputs.push-to-registry }}
        github-token: ${{ inputs.github-token }}

    - uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
      if: steps.extract-subjects.outputs['subject-4-name'] != ''
      with:
        subject-name: ${{ steps.extract-subjects.outputs['subject-4-name'] }}
        subject-digest: ${{ steps.extract-subjects.outputs['subject-4-digest'] }}
        push-to-registry: ${{ inputs.push-to-registry }}
        github-token: ${{ inputs.github-token }}
