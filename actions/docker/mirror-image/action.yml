# Copy an already validated image to one explicit registry tag without rebuilding.
# The source must include its immutable SHA-256 digest. Single-platform manifests
# and multi-platform indexes retain their digest; a changed digest fails the action.
# Registry signatures and referrers are not copied separately. Verify the source
# before calling and use the shared mirror workflow to serialize destination writes.
# Requires Docker and a Linux runner. Credentials are optional for local test registries.
---
name: Docker - Mirror image
description: Copy an immutable image to another registry without changing its digest.
author: hoverkraft
branding:
  icon: copy
  color: blue
inputs:
  source-image:
    description: Fully qualified source image including its SHA-256 digest.
    required: true
  destination-image:
    description: Fully qualified destination image with an explicit tag.
    required: true
  source-registry-username:
    description: Source registry username, paired with its password.
    default: ""
  source-registry-password:
    description: Source registry password or token. Empty skips authentication.
    default: ""
  destination-registry-username:
    description: Destination registry username, paired with its password.
    default: ""
  destination-registry-password:
    description: Destination registry password or token. Empty skips authentication.
    default: ""
outputs:
  image:
    description: Destination tag qualified by the unchanged source digest.
    value: ${{ steps.copy.outputs.image }}
runs:
  using: composite
  steps:
    - name: Validate immutable source and tagged destination
      id: references
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        SOURCE: ${{ inputs.source-image }}
        DESTINATION: ${{ inputs.destination-image }}
      with:
        script: |
          const { pathToFileURL } = require('node:url');
          const { ImageMirror } = await import(pathToFileURL(`${process.env.ACTION_PATH}/src/mirror.js`));
          const mirror = new ImageMirror(process.env.SOURCE, process.env.DESTINATION);
          core.setOutput('source-registry', mirror.sourceRegistry);
          core.setOutput('destination-registry', mirror.destinationRegistry);
    - name: Authenticate to the source registry
      if: inputs.source-registry-password != ''
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ steps.references.outputs.source-registry }}
        username: ${{ inputs.source-registry-username }}
        password: ${{ inputs.source-registry-password }}
    - name: Authenticate to the destination registry
      if: inputs.destination-registry-password != ''
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ${{ steps.references.outputs.destination-registry }}
        username: ${{ inputs.destination-registry-username }}
        password: ${{ inputs.destination-registry-password }}
    - name: Set up registry tooling
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        driver: docker
    - name: Copy the retained manifest and layers
      id: copy
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        SOURCE: ${{ inputs.source-image }}
        DESTINATION: ${{ inputs.destination-image }}
      with:
        script: |
          const { pathToFileURL } = require('node:url');
          const { ImageMirror } = await import(pathToFileURL(`${process.env.ACTION_PATH}/src/mirror.js`));
          const image = await new ImageMirror(process.env.SOURCE, process.env.DESTINATION).copy(exec, process.env.RUNNER_TEMP);
          core.setOutput('image', image);
