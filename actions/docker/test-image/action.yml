---
name: Docker - Test Image
description: |
  Test one immutable image with a native Testcontainers/Node or Goss suite.
  Checkout and [Docker setup](../setup/README.md) belong to the caller. Use a Linux
  amd64 or arm64 runner with a local Unix Docker socket and registry authentication.
  Pass a fully qualified registry digest or a local `sha256:...` image ID.

  Set `working-directory` to your suite directory. `engine: auto` selects root
  `*.test.js` files or `goss.yaml`; missing or ambiguous suites fail. Select `engine`
  explicitly for mixed directories. A failed run never switches engines.

  - [Node example](../../../tests/container-image/testcontainers-node/image.test.js):
    use `node:test` and `new GenericContainer(process.env.TESTED_IMAGE_REF)`.
    The released runner supplies Testcontainers and runs trusted suites as root with
    Docker access. `TESTED_IMAGE_REF` is the resolved local image ID;
    `TESTED_IMAGE_SOURCE` and `TESTED_IMAGE_PLATFORM` identify the original input and platform.
  - [Goss example](../../../tests/container-image/goss/goss.yaml): use `goss.yaml`
    and optional `goss_wait.yaml`. The image must stay running and provide `sh`;
    use Node for CLI or shell-less images. Goss keeps the image's user and entrypoint.

  Native JUnit report bundles and diagnostics are retained for seven days, including after
  failures. Missing, stale, invalid, empty or all-skipped results fail validation.
  Use the common `ci-reports` workflow with producer jobs in `needs`, `if: always()`
  and `job-results` set to the JSON representation of `needs`. Forward the action's `report-plan` output from the calling job.
  The action posts no PR comments and cleans only its own resources; cancellation
  cleanup is best effort. Keep native suite cleanup in place.

  `validation` is available only after successful execution, reporting and cleanup.
  For promotion, forward the original producer entry matching the tested registry
  digest and require every suite/platform job. Local image IDs and single-platform
  checks do not certify a later push or an entire multi-platform index.
  See [ADR 0014](../../../docs/adr/0014-standardize-container-image-tests.md) for the contract.

  Run the same suites locally from a checkout with Node.js 24+ and Docker. Set
  `IMAGE_DIGEST_REFERENCE` to the candidate's digest reference; tool versions come
  from [tooling.json](tooling.json). The CLI prints and retains results for inspection:

  ```sh
  node actions/docker/test-image/bin/test-image.mjs \
    --image "$IMAGE_DIGEST_REFERENCE" \
    --working-directory /path/to/container-tests \
    --output-directory .cache/container-test-results
  ```

author: hoverkraft
branding:
  icon: check-circle
  color: blue

inputs:
  image:
    description: Fully qualified registry reference containing @sha256, or an exact local Docker sha256 image ID. Tag-only references are rejected.
    required: true
  working-directory:
    description: Suite directory, absolute or relative to the repository root.
    default: .
  engine:
    description: Test engine, auto, testcontainers-node or goss. Auto requires exactly one suite kind.
    default: auto
  platform:
    description: |-
      Requested Linux image platform (amd64 or arm64, optionally with variant). Defaults to the daemon's native
      platform. Configure compatible runners or emulation explicitly.
    default: ""
  timeout:
    description: |-
      Overall engine execution timeout in seconds, from 1 to 3600. Defaults to 300. Tool acquisition is
      separately bounded; Goss readiness is limited to 30 seconds or this timeout, whichever is shorter.
    default: "300"
  report-file:
    description: |-
      Optional native JUnit paths or globs, relative to working-directory or absolute, separated by newlines,
      commas or semicolons. Every explicit entry must match a new or changed report from this invocation.
      Defaults to the adapter's own JUnit report, which is always required for validation.
    default: ""
  path-mapping:
    description: |-
      Report path mappings forwarded to the common parser. Defaults to mapping the Node runner suite path into
      working-directory. An explicit value replaces that mapping.
    default: ""
  report-plan:
    description: Expected producer metadata supplied by orchestration. Leave empty for standalone use.
    default: ""

outputs:
  report-artifact-id:
    description: Native report bundle, including diagnostic metadata and available test reports after failures.
    value: ${{ steps.reports.outputs.artifact-id }}
  diagnostic-artifact-id:
    description: Engine and available container log artifact ID, including after failures and timeouts.
    value: ${{ steps.upload-diagnostics.outputs.artifact-id }}
  validation:
    description: |-
      Successful image validation JSON with image identity, resolved engine, suite, observed platform,
      run/attempt, executed test counts and report/log paths. Empty on failure; a diagnostic artifact never
      establishes success.
    value: ${{ steps.validation.outputs.result }}
  report-plan:
    description: Expected native report plan. Forward this from the calling job to ci-reports.
    value: ${{ steps.report-plan.outputs.report-plan }}

runs:
  using: composite
  steps:
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@af0bdd6313bd49aaf4a8a7f0de005fb0db856b03 # 4.3.3
      with:
        working-directory: ${{ inputs.working-directory }}
    - id: report-plan
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@5ea25078a15fe361993382872c03a63fd667c11a # unified reports (PR #683, unreleased)
      with:
        operation: plan
        report-plan: ${{ inputs.report-plan }}
        producers: '[{"key":"test","type":"test","directory":${{ toJSON(steps.directory.outputs.workspace-relative-path || ''.'') }},"coverage":[]}]'

    - name: Prepare container tests
      id: prepare
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        DIRECTORY: ${{ steps.directory.outputs.absolute-path }}
        IMAGE: ${{ inputs.image }}
        ENGINE: ${{ inputs.engine }}
        PLATFORM: ${{ inputs.platform }}
        TEST_TIMEOUT: ${{ inputs.timeout }}
        REPORT_FILE: ${{ inputs.report-file }}
      with:
        script: |
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');
          const { ContainerTest } = await import(pathToFileURL(path.join(process.env.ACTION_PATH, 'dist/index.js')));
          const test = await ContainerTest.prepare({
            workingDirectory: process.env.DIRECTORY, image: process.env.IMAGE,
            engine: process.env.ENGINE, platform: process.env.PLATFORM,
            timeout: process.env.TEST_TIMEOUT, reportFile: process.env.REPORT_FILE,

          });
          const { state } = test;
          core.info(`Selected ${state.engine}: ${state.tests.join(', ')}`);
          const revision = await exec.getExecOutput('git',['-C',state.workingDirectory,'rev-parse','HEAD'],{ignoreReturnCode:true,silent:true});
          core.setOutput('source-sha',revision.exitCode === 0 ? revision.stdout.trim() : '');
          core.setOutput('state', path.join(state.directory, 'state.json'));
          core.setOutput('diagnostics', path.join(state.directory, 'diagnostics'));
          core.setOutput('diagnostic-name', `container-test-${state.attempt}-${state.group}-${state.id}`);

    - name: Run container tests
      id: run
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        TEST_STATE: ${{ steps.prepare.outputs.state }}
      with:
        script: |
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');
          const { ContainerTest } = await import(pathToFileURL(path.join(process.env.ACTION_PATH, 'dist/index.js')));
          const tooling = JSON.parse(require('node:fs').readFileSync(path.join(process.env.ACTION_PATH, 'tooling.json')));
          await ContainerTest.load(process.env.TEST_STATE).run(tooling);

    - name: Select current native reports
      id: select-reports
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.run.outcome != 'skipped' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        TEST_STATE: ${{ steps.prepare.outputs.state }}
      with:
        script: |+
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');
          const { ContainerTest } = await import(pathToFileURL(path.join(process.env.ACTION_PATH, 'dist/index.js')));
          const test = ContainerTest.load(process.env.TEST_STATE);
          const { state } = test;
          const files = await test.reportFiles();
          const fs=require('node:fs');
          const directory=path.join(state.directory,'publication');
          fs.mkdirSync(directory,{recursive:true});
          const copied=files.map((file,index)=>{
            const target=path.join(directory,index+'-'+path.basename(file));
            fs.copyFileSync(file,target);return target;
          });
          core.setOutput('directory',directory);
          core.setOutput('files',copied.join('\n'));
          core.setOutput('metadata',{image:state.image,imageId:state.imageId,engine:state.engine,platform:state.platform,suite:state.tests});
          core.setOutput('path-mapping', state.engine === 'testcontainers-node' ? `/workspace/image:${state.workingDirectory}` : '');
          core.setOutput('json', files);

    - name: Record container test results
      id: reports
      if: ${{ !cancelled() && steps.select-reports.outcome == 'success' }}
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@5ea25078a15fe361993382872c03a63fd667c11a # unified reports (PR #683, unreleased)
      with:
        working-directory: ${{ steps.select-reports.outputs.directory }}
        report-plan: ${{ steps.report-plan.outputs.report-plan }}
        report-paths: ${{ steps.select-reports.outputs.files }}
        path-mapping: ${{ inputs.path-mapping || steps.select-reports.outputs.path-mapping }}
        source-sha: ${{ steps.prepare.outputs.source-sha }}
        metadata: ${{ steps.select-reports.outputs.metadata }}

    - name: Validate executed test cases
      if: ${{ !cancelled() && steps.select-reports.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        TEST_STATE: ${{ steps.prepare.outputs.state }}
        REPORT_FILES: ${{ steps.select-reports.outputs.json }}
      with:
        script: |
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');
          const { ContainerTest } = await import(pathToFileURL(path.join(process.env.ACTION_PATH, 'dist/index.js')));
          ContainerTest.load(process.env.TEST_STATE).result(JSON.parse(process.env.REPORT_FILES));

    - name: Clean owned resources and tool files
      id: cleanup
      if: ${{ always() && steps.prepare.outcome == 'success' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        TEST_STATE: ${{ steps.prepare.outputs.state }}
      with:
        script: |
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');
          const { ContainerTest } = await import(pathToFileURL(path.join(process.env.ACTION_PATH, 'dist/index.js')));
          await ContainerTest.load(process.env.TEST_STATE).finish();

    - name: Retain container diagnostics
      id: upload-diagnostics
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.prepare.outputs.diagnostic-name }}
        path: ${{ steps.prepare.outputs.diagnostics }}
        if-no-files-found: warn
        retention-days: 7

    - name: Expose successful validation
      id: validation
      env:
        ACTION_PATH: ${{ github.action_path }}
        TEST_STATE: ${{ steps.prepare.outputs.state }}
        REPORT_FILES: ${{ steps.select-reports.outputs.json }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const path = require('node:path');
          const { pathToFileURL } = require('node:url');
          const { ContainerTest } = await import(pathToFileURL(path.join(process.env.ACTION_PATH, 'dist/index.js')));
          return ContainerTest.load(process.env.TEST_STATE).result(JSON.parse(process.env.REPORT_FILES));
