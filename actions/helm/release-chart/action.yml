---
name: "Release Helm Chart"
description: |
  Action to release a Helm chart to OCI registry.
  Signs the published chart digest with Cosign and GitHub Actions OIDC by default.
  Set `sign` to `false` to opt out and still consume the immutable digest output.
  Delegates final metadata, published values, locked dependencies and packaging
  to prepare-chart. Push retries reuse the same prepared archive.
author: hoverkraft
branding:
  icon: upload-cloud
  color: blue

inputs:
  oci-registry:
    description: |
      OCI registry where to push chart.
    required: true
    default: "ghcr.io"
  oci-registry-username:
    required: true
    description: |
      OCI registry username.
    default: ${{ github.repository_owner }}
  oci-registry-password:
    required: true
    description: |
      OCI registry password.
    default: ${{ github.token }}
  chart:
    description: "Chart name to release"
    required: true
  path:
    description: "Path to the chart to release"
    required: true
  values:
    description: |
      Define charts values to be filled.
      See https://mikefarah.gitbook.io/yq/.
      Format: `[{ file, path, value }]`.

      Example:

      ```json
      [
        {
          "file": "charts/application/charts/api/values.yaml",
          "path": ".image.registry", "value": "ghcr.io"
        }
      ]
      ```
    required: false
  helm-repositories:
    description: |
      List of Helm repositories to add before release charts.
      See https://helm.sh/docs/helm/helm_repo_add/.
    required: false
  tag:
    description: "The release tag to set to chart"
    required: true
  update-tag-paths:
    description: |
      List of YAML paths to update with the tag.
      Comma separated list of paths.
    required: false
    default: ".version,.appVersion"
  ref:
    description: |
      The Git ref to checkout before releasing the chart.
      Can be a branch, tag or commit SHA.
    required: false
  sign:
    description: |
      Sign the published OCI chart using Cosign and GitHub Actions OIDC.
      Enabled by default. Set to `false` to opt out.
      Requires `id-token: write` and write access to the OCI registry.
      Does not generate a Helm PGP provenance (.prov) file.
    required: false
    default: "true"

outputs:
  image:
    value: ${{ steps.chart-releaser.outputs.image }}
    description: |
      Chart image (Format: `{registry}/{repository}/{image}:{tag}`).
  digest:
    value: ${{ steps.chart-releaser.outputs.digest }}
    description: "Published chart OCI manifest digest (Format: `sha256:...`)."
  image-digest:
    value: ${{ steps.chart-releaser.outputs.image-digest }}
    description: "Immutable chart reference (Format: `{registry}/{repository}/{image}@sha256:...`)."

runs:
  using: "composite"
  steps:
    - name: Validate signing configuration
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        INPUT_SIGN: ${{ inputs.sign }}
        INPUT_TAG: ${{ inputs.tag }}
      with:
        script: |
          if (!process.env.INPUT_TAG?.trim()) throw new Error('"tag" input is missing');
          const sign = process.env.INPUT_SIGN;
          if (!['true', 'false'].includes(sign)) {
            throw new Error('"sign" must be "true" or "false".');
          }
          if (sign === 'true' && (!process.env.ACTIONS_ID_TOKEN_REQUEST_URL || !process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN)) {
            throw new Error('Signing charts requires the workflow job to grant id-token: write.');
          }

    - uses: hoverkraft-tech/ci-github-common/actions/checkout@0864018583d79f7e535f572005baa35f2e864849 # 4.1.0
      with:
        ref: ${{ inputs.ref }}

    - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

    - name: Prepare chart archive
      id: prepare-chart
      uses: $/actions/helm/prepare-chart
      with:
        path: ${{ inputs.path }}
        name: ${{ github.event.repository.name }}
        tag: ${{ inputs.tag }}
        update-tag-paths: ${{ inputs.update-tag-paths }}
        values: ${{ inputs.values }}
        helm-repositories: ${{ inputs.helm-repositories }}

    - id: chart-releaser
      name: Push prepared chart
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CHART_ARCHIVE: ${{ steps.prepare-chart.outputs.archive }}
        CHART_CHECKSUM: ${{ steps.prepare-chart.outputs.checksum }}
        INPUT_REGISTRY: ${{ inputs.oci-registry }}
        INPUT_USERNAME: ${{ inputs.oci-registry-username }}
        INPUT_PASSWORD: ${{ inputs.oci-registry-password }}
        CHART_REPOSITORY: ${{ github.repository }}/charts/${{ inputs.chart }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const { createHash } = require('node:crypto');
          const archive = process.env.CHART_ARCHIVE;
          const checksum = createHash('sha256').update(fs.readFileSync(archive)).digest('hex');
          if (checksum !== process.env.CHART_CHECKSUM) throw new Error('Prepared chart checksum mismatch.');
          const registry = process.env.INPUT_REGISTRY;
          const destination = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'helm-release-'));
          const registryConfig = path.join(destination, 'registry.json');
          let loggedIn = false;
          try {
            await exec.exec('helm', [
              'registry', 'login', registry, '--username', process.env.INPUT_USERNAME,
              '--password-stdin', '--registry-config', registryConfig,
            ], { input: Buffer.from(process.env.INPUT_PASSWORD) });
            loggedIn = true;
            const pushArgs = [
              'push', archive, `oci://${registry}/${process.env.CHART_REPOSITORY}`,
              '--registry-config', registryConfig,
            ];
            const maxAttempts = 6;
            let delayMs = 5000;
            let result;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              result = await exec.getExecOutput('helm', pushArgs, { ignoreReturnCode: true });
              if (result.exitCode === 0) {
                break;
              }

              const pushError = `${result.stderr}\n${result.stdout}`.trim();
              // Helm may upload a manifest before the registry can resolve it for tagging.
              const tagNotFound = /failed to perform "Tag" on destination: sha256:[a-f0-9]{64}: not found/i.test(pushError);
              if (!tagNotFound || attempt === maxAttempts) {
                throw new Error(`Helm push failed (attempt ${attempt}/${maxAttempts}, exit code: ${result.exitCode}).\n${pushError}`);
              }

              core.warning(`Chart manifest is not yet available for tagging (attempt ${attempt}/${maxAttempts}). Retrying in ${delayMs}ms...`);
              // Reuse the archive and its timestamp so retries publish the same manifest.
              await new Promise(resolve => setTimeout(resolve, delayMs));
              delayMs *= 2;
            }
            // Helm reports the pushed reference and manifest digest on stderr.
            // Capture the push result so a concurrent tag update cannot change what we sign.
            const output = `${result.stdout}\n${result.stderr}`;
            const images = [...output.matchAll(/^Pushed:[ \t]+(\S+)[ \t]*\r?$/gm)];
            const digests = [...output.matchAll(/^Digest:[ \t]+(sha256:[a-f0-9]{64})[ \t]*\r?$/gm)];
            if (images.length !== 1 || digests.length !== 1) {
              throw new Error('Helm push did not return a chart reference and SHA-256 manifest digest.');
            }
            const image = images[0][1];
            const digest = digests[0][1];
            core.setOutput('image', image);
            core.setOutput('digest', digest);
            core.setOutput('image-digest', `${image.slice(0, image.lastIndexOf(':'))}@${digest}`);
          } finally {
            try {
              if (loggedIn) {
                await exec.exec('helm', ['registry', 'logout', registry, '--registry-config', registryConfig]);
              }
            } catch (error) {
              core.warning(`Helm registry logout failed: ${error.message}`);
            } finally {
              fs.rmSync(destination, { recursive: true, force: true });
            }
          }

    - name: Sign chart digest
      if: inputs.sign == 'true'
      uses: $/actions/helm/sign-chart
      with:
        oci-registry: ${{ inputs.oci-registry }}
        oci-registry-username: ${{ inputs.oci-registry-username }}
        oci-registry-password: ${{ inputs.oci-registry-password }}
        charts: ${{ steps.chart-releaser.outputs.image }}@${{ steps.chart-releaser.outputs.digest }}

    - name: Clean prepared archive
      if: ${{ always() && steps.prepare-chart.outputs.archive != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CHART_ARCHIVE: ${{ steps.prepare-chart.outputs.archive }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          fs.rmSync(path.dirname(process.env.CHART_ARCHIVE), { recursive: true, force: true });
