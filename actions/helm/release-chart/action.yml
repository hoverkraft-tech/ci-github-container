---
name: "Release Helm Chart"
description: |
  Action to release a Helm chart to OCI registry.
  Signs the published chart digest with Cosign and GitHub Actions OIDC by default.
  Set `sign` to `false` to opt out and still consume the immutable digest output.
  Supports umbrella charts: if a chart has local dependencies having version `0.0.0`,
  the action will update those dependencies version with the given tag, then update the Chart.lock accordingly.
author: hoverkraft
branding:
  icon: upload-cloud
  color: blue

inputs:
  oci-registry:
    description: |
      OCI registry where to push chart.
    required: true
    default: "ghcr.io"
  oci-registry-username:
    required: true
    description: |
      OCI registry username.
    default: ${{ github.repository_owner }}
  oci-registry-password:
    required: true
    description: |
      OCI registry password.
    default: ${{ github.token }}
  chart:
    description: "Chart name to release"
    required: true
  path:
    description: "Path to the chart to release"
    required: true
  values:
    description: |
      Define charts values to be filled.
      See https://mikefarah.gitbook.io/yq/.
      Format: `[{ file, path, value }]`.

      Example:

      ```json
      [
        {
          "file": "charts/application/charts/api/values.yaml",
          "path": ".image.registry", "value": "ghcr.io"
        }
      ]
      ```
    required: false
  helm-repositories:
    description: |
      List of Helm repositories to add before release charts.
      See https://helm.sh/docs/helm/helm_repo_add/.
    required: false
  tag:
    description: "The release tag to set to chart"
    required: true
  update-tag-paths:
    description: |
      List of YAML paths to update with the tag.
      Comma separated list of paths.
    required: false
    default: ".version,.appVersion"
  ref:
    description: |
      The Git ref to checkout before releasing the chart.
      Can be a branch, tag or commit SHA.
    required: false
  sign:
    description: |
      Sign the published OCI chart using Cosign and GitHub Actions OIDC.
      Enabled by default. Set to `false` to opt out.
      Requires `id-token: write` and write access to the OCI registry.
      Does not generate a Helm PGP provenance (.prov) file.
    required: false
    default: "true"

outputs:
  image:
    value: ${{ steps.chart-releaser.outputs.image }}
    description: |
      Chart image (Format: `{registry}/{repository}/{image}:{tag}`).
  digest:
    value: ${{ steps.chart-releaser.outputs.digest }}
    description: "Published chart OCI manifest digest (Format: `sha256:...`)."
  image-digest:
    value: ${{ steps.chart-releaser.outputs.image-digest }}
    description: "Immutable chart reference (Format: `{registry}/{repository}/{image}@sha256:...`)."

runs:
  using: "composite"
  steps:
    - name: Validate signing configuration
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        INPUT_SIGN: ${{ inputs.sign }}
      with:
        script: |
          const sign = process.env.INPUT_SIGN;
          if (!['true', 'false'].includes(sign)) {
            throw new Error('"sign" must be "true" or "false".');
          }
          if (sign === 'true' && (!process.env.ACTIONS_ID_TOKEN_REQUEST_URL || !process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN)) {
            throw new Error('Signing charts requires the workflow job to grant id-token: write.');
          }

    - uses: hoverkraft-tech/ci-github-common/actions/checkout@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
      with:
        ref: ${{ inputs.ref }}

    - id: chart-tag-updates
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_UPDATE_TAG_PATHS: ${{ inputs.update-tag-paths }}
        INPUT_VALUES: ${{ inputs.values }}
        REPOSITORY_NAME: ${{ github.event.repository.name }}
      with:
        script: |
          const path = require('node:path');

          const basePath = process.env.INPUT_PATH;
          if (!basePath) {
            throw new Error(`"path" input is missing`);
          }

          const tag = process.env.INPUT_TAG;
          if (!tag) {
            throw new Error(`"tag" input is missing`);
          }

          const inputValues = process.env.INPUT_VALUES;
          let chartValues = [];
          if (inputValues) {
            try {
              chartValues = JSON.parse(inputValues);
            } catch (error) {
              throw new Error(`"values" input is not a valid JSON: ${error}`);
            }

            if (!Array.isArray(chartValues)) {
              throw new Error(`"values" input is not an array`);
            }
          }

          const updateTagPaths = process.env.INPUT_UPDATE_TAG_PATHS.trim().split(',').map(p => p.trim()).filter(p => p);
          const chartRootPath = path.resolve(process.env.GITHUB_WORKSPACE ?? '.', basePath);
          const generatedValues = [];

          const globber = await glob.create(`${basePath}/**/Chart.yaml`, { followSymbolicLinks: false });
          for await (const chartFile of globber.globGenerator()) {
            const filePath = path.relative(chartRootPath, chartFile);

            const isRootChart = filePath === 'Chart.yaml';
            if (isRootChart) {
              generatedValues.push({
                file: filePath,
                path: '.name',
                value: process.env.REPOSITORY_NAME,
              });

              if (updateTagPaths.includes('.version')) {
                generatedValues.push({
                  file: filePath,
                  path: '(.dependencies[]? | select(.repository | test("^file://")).version)',
                  value: tag,
                });
              }
            }

            for (const path of updateTagPaths) {
              generatedValues.push({
                file: filePath,
                path,
                value: tag,
              });
            }
          }

          core.setOutput('values', JSON.stringify([...generatedValues, ...chartValues]));

    - uses: hoverkraft-tech/ci-github-common/actions/local-actions@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
      with:
        source-path: ${{ github.action_path }}/../..
        destination-directory-name: self-actions-release-chart

    - uses: ./../self-actions-release-chart/helm/update-chart-values
      with:
        path: ${{ inputs.path }}
        values: ${{ steps.chart-tag-updates.outputs.values }}

    - name: Setup Node.js
      uses: hoverkraft-tech/ci-github-nodejs/actions/setup-node@81a4bca8445b7b273455ff26a9a5c3c31c86b2a1 # 0.25.0
      with:
        working-directory: ${{ github.action_path }}

    - name: Rewrite the Chart.lock to match with updated umbrella dependencies if any
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TAG: ${{ inputs.tag }}
        NODE_PATH: ${{ github.action_path }}/node_modules
      with:
        script: |
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const yaml = require('yaml');

          const rootChartFile = process.env.INPUT_PATH + '/Chart.yaml';
          const rootChartFileContent = yaml.parse(fs.readFileSync(rootChartFile, 'utf8'));

          if (!rootChartFileContent.dependencies || rootChartFileContent.dependencies.length === 0) {
            core.debug(`No dependencies found in Chart.yaml file: ${rootChartFile}`);
            return;
          }

          const chartLockFile = process.env.INPUT_PATH + '/Chart.lock';
          if (!fs.existsSync(chartLockFile)) {
            core.debug(`Chart.lock file not found: ${chartLockFile}`);
            return core.setFailed(`Chart.lock file not found: ${chartLockFile}`);
          }

          const chartLockFileContent = yaml.parse(fs.readFileSync(chartLockFile, 'utf8'));

          let hasLocalDependencies = false;
          const dependencies = chartLockFileContent.dependencies;

          for (const dependency of dependencies) {
            const isLocalDependency = dependency.repository.startsWith('file://') && dependency.version === '0.0.0';
            core.debug(`Dependency ${dependency.name} is local: ${isLocalDependency}`);

            if (isLocalDependency) {
              dependency.version = process.env.INPUT_TAG;
              hasLocalDependencies = true;
            }
          }

          if (!hasLocalDependencies) {
            core.debug(`No local dependencies found in Chart.lock file: ${chartLockFile}`);
            return;
          }

          chartLockFileContent.generated = new Date().toISOString();

          function hashReq(req, lock) {
            req = req.map(sortDependencyFields);
            lock = lock.map(sortDependencyFields);

            const data = JSON.stringify([req, lock]);
            const hash = digest(data);
            return `sha256:${hash}`;
          }

          function digest(input) {
            const hash = crypto.createHash('sha256');
            hash.update(input);
            return hash.digest('hex');
          }

          function sortDependencyFields(dependency) {
            const fieldOrder = [
              'name',
              'version',
              'repository',
              'condition',
              'tags',
              'enabled',
              'import-values',
              'alias',
            ];
            const sortedDependency = {};
            for (const field of fieldOrder) {
              if (Object.prototype.hasOwnProperty.call(dependency, field)) {
                sortedDependency[field] = dependency[field];
              }
            }

            return sortedDependency;
          }

          const req = rootChartFileContent.dependencies;
          const lock = dependencies;

          chartLockFileContent.digest = hashReq(req, lock);

          const updatedChartLockFileContent = yaml.stringify(chartLockFileContent);
          core.debug(`Updated Chart.lock file content:\n${updatedChartLockFileContent}`);

          fs.writeFileSync(chartLockFile, updatedChartLockFileContent, 'utf8');

    - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

    - name: Prepare chart dependencies
      uses: ./../self-actions-release-chart/helm/prepare-chart
      with:
        path: ${{ inputs.path }}
        helm-repositories: >-
          ${{ inputs.helm-repositories }}

    - id: chart-releaser
      name: Package and push chart
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_REGISTRY: ${{ inputs.oci-registry }}
        INPUT_USERNAME: ${{ inputs.oci-registry-username }}
        INPUT_PASSWORD: ${{ inputs.oci-registry-password }}
        CHART_REPOSITORY: ${{ github.repository }}/charts/${{ inputs.chart }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const registry = process.env.INPUT_REGISTRY;
          const destination = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'helm-release-'));
          const registryConfig = path.join(destination, 'registry.json');
          let loggedIn = false;
          try {
            await exec.exec('helm', [
              'registry', 'login', registry, '--username', process.env.INPUT_USERNAME,
              '--password-stdin', '--registry-config', registryConfig,
            ], { input: Buffer.from(process.env.INPUT_PASSWORD) });
            loggedIn = true;
            await exec.exec('helm', [
              'package', path.resolve(process.env.INPUT_PATH), '--version', process.env.INPUT_TAG, '--destination', destination,
            ]);
            const packages = fs.readdirSync(destination).filter(file => file.endsWith('.tgz'));
            if (packages.length !== 1) {
              throw new Error('Expected exactly one packaged chart.');
            }
            const result = await exec.getExecOutput('helm', [
              'push', path.join(destination, packages[0]), `oci://${registry}/${process.env.CHART_REPOSITORY}`,
              '--registry-config', registryConfig,
            ]);
            // Helm reports the pushed reference and manifest digest on stderr.
            // Capture the push result so a concurrent tag update cannot change what we sign.
            const output = `${result.stdout}\n${result.stderr}`;
            const images = [...output.matchAll(/^Pushed:[ \t]+(\S+)[ \t]*\r?$/gm)];
            const digests = [...output.matchAll(/^Digest:[ \t]+(sha256:[a-f0-9]{64})[ \t]*\r?$/gm)];
            if (images.length !== 1 || digests.length !== 1) {
              throw new Error('Helm push did not return a chart reference and SHA-256 manifest digest.');
            }
            const image = images[0][1];
            const digest = digests[0][1];
            core.setOutput('image', image);
            core.setOutput('digest', digest);
            core.setOutput('image-digest', `${image.slice(0, image.lastIndexOf(':'))}@${digest}`);
          } finally {
            try {
              if (loggedIn) {
                await exec.exec('helm', ['registry', 'logout', registry, '--registry-config', registryConfig]);
              }
            } catch (error) {
              core.warning(`Helm registry logout failed: ${error.message}`);
            } finally {
              fs.rmSync(destination, { recursive: true, force: true });
            }
          }

    - name: Sign chart digest
      if: inputs.sign == 'true'
      uses: ./../self-actions-release-chart/helm/sign-chart
      with:
        oci-registry: ${{ inputs.oci-registry }}
        oci-registry-username: ${{ inputs.oci-registry-username }}
        oci-registry-password: ${{ inputs.oci-registry-password }}
        charts: ${{ steps.chart-releaser.outputs.image }}@${{ steps.chart-releaser.outputs.digest }}
