---
name: "Helm - Generate Chart Documentation"
description: |
  Action to generate documentation for a Helm chart.
  It will generate the documentation in the `docs/` directory of the chart.
  Mainly using [losisin/helm-docs-github-action](https://github.com/losisin/helm-docs-github-action).
  Formatting runs from committed JavaScript and data in dist, without Node.js setup or npm installation.
  Retains Textlint/Markdownlint configuration and ignores, Prettier configuration and caller-owned plugins.
  Custom modules must already be available in the caller checkout; missing modules or invalid configuration fail.
  Remaining Markdown style findings are advisory; Textlint errors and Prettier failures block publication.
  See [the bundling decision](../../../docs/adr/0011-skip-unchanged-helm-documentation.md#bundle-formatting-tools).
author: hoverkraft
branding:
  icon: book-open
  color: blue

inputs:
  working-directory:
    description: "Working directory"
    required: false
    default: "${{ github.workspace }}"
  checkout-ref:
    description: |
      The Git ref to checkout before generating documentation.
      Can be a branch, tag or commit SHA.
      Set to an empty string to skip checkout.
    required: false
    default: ${{ github.ref }}
  values-file:
    description: |
      Path to the values file to use for generating the documentation.
      See https://github.com/losisin/helm-values-schema-json-action.
    required: false
  skip-if-only-changed:
    description: |
      Optional newline-separated repository-relative files or directories whose changes cannot affect chart documentation.
      Paths are literal, and directories must end with a slash. Empty keeps generation unconditional.
      On the first attempt of a default-branch push, skip only when every change since the same workflow's last successful push is listed.
      Chart search paths and the explicit values file always require generation. Missing history, API/Git uncertainty, local edits and reruns generate normally.
      Requires a caller checkout and actions: read plus contents: read to inspect history; missing access falls back to generation.
      Invoke after required checks on every default-branch push; additional job/path filters can hide pending documentation changes.
      Keep this list aligned with custom templates. For example:
        application/
        docs/
        e2e/
        README.md
      See [the decision](../../../docs/adr/0011-skip-unchanged-helm-documentation.md) for safety and recovery behavior.
    required: false
    default: ""
  merge-method:
    description: |
      Merge strategy for the documentation pull request: `merge`, `rebase`, or `squash`.
      Use `squash` for branches requiring signed commits and enable squash merging in the repository settings.
    required: false
    default: rebase
  github-token:
    description: |
      GitHub Token to create and merge pull request.
      Permissions:
      - contents: write
      - pull-requests: write
    default: ${{ github.token }}
  github-app-client-id:
    description: |
      GitHub App client ID to generate GitHub token in place of github-token.
      See https://github.com/actions/create-github-app-token.
    required: false
  github-app-key:
    description: |
      GitHub App private key to generate GitHub token in place of github-token.
      See https://github.com/actions/create-github-app-token.
    required: false

outputs:
  merged-sha:
    description: "The SHA of the commit that was merged to the base branch. Will be empty if no pull request was created or merged."
    value: ${{ steps.create-and-merge-pull-request.outputs.merged-sha }}

runs:
  using: "composite"
  steps:
    - id: prepare-variables
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_VALUES_FILE: ${{ inputs.values-file }}
      with:
        script: |
          const { existsSync, realpathSync, writeFileSync } = require('node:fs');
          const { basename, isAbsolute, join } = require('node:path');

          let workingDirectory = process.env.INPUT_WORKING_DIRECTORY || "";
          if (!workingDirectory || !workingDirectory.length) {
            return core.setFailed("Input 'working-directory' is required.");
          }

          if (!existsSync(workingDirectory)) {
            return core.setFailed(`Working directory '${workingDirectory}' does not exist.`);
          }

          workingDirectory = realpathSync(workingDirectory);
          core.setOutput("working-directory", workingDirectory);
          core.setOutput("working-directory-name", basename(workingDirectory));

          let valuesFile = process.env.INPUT_VALUES_FILE || "";
          if (valuesFile && valuesFile.length) {
            if(isAbsolute(valuesFile)) {
              if (!existsSync(valuesFile)) {
                return core.setFailed(`The values file '${valuesFile}' does not exist.`);
              }
            } else {
              valuesFile = join(workingDirectory, valuesFile);
              if(!existsSync(valuesFile)) {
                return core.setFailed(`The values file '${valuesFile}' does not exist in the working directory '${workingDirectory}'.`);
              }
            }

            valuesFile = realpathSync(valuesFile);
            core.setOutput("values-file", valuesFile);
          }

          // Generate textlint config file if not exists
          let textlintConfigPath = join(workingDirectory, ".textlintrc");
          if (!existsSync(textlintConfigPath)) {
            textlintConfigPath = join(process.env.RUNNER_TEMP, `${Date.now()}.textlintrc`);
            const defaultConfig = {
              "filters": {
                "comments": true
              },
              "rules": {
                "terminology": true
              },
              "plugins": {
                "@textlint/markdown": true
              }
            };
            writeFileSync(textlintConfigPath, JSON.stringify(defaultConfig, null, 2));
          }
          core.setOutput("textlint-config-path", textlintConfigPath);

          // Generate markdownlint config file if not exists
          let markdownlintConfigPath = join(workingDirectory, ".markdownlint.json");
          if (!existsSync(markdownlintConfigPath)) {
            markdownlintConfigPath = join(process.env.RUNNER_TEMP, `${Date.now()}.markdownlint.json`);

            const defaultConfig = {
              "default": true,
              "line-length": false
            };
            writeFileSync(markdownlintConfigPath, JSON.stringify(defaultConfig, null, 2));
          }
          core.setOutput("markdownlint-config-path", markdownlintConfigPath);

    - name: Determine whether documentation inputs changed
      id: changes
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        SKIP_IF_ONLY_CHANGED: ${{ inputs.skip-if-only-changed }}
        CHECKOUT_REF: ${{ inputs.checkout-ref }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        WORKSPACE: ${{ github.workspace }}
        WORKING_DIRECTORY: ${{ steps.prepare-variables.outputs.working-directory }}
        VALUES_FILE: ${{ steps.prepare-variables.outputs.values-file }}
      with:
        script: |
          const { pathToFileURL } = require('node:url');
          const { DocumentationChanges } = await import(pathToFileURL(`${process.env.ACTION_PATH}/dist/index.js`));
          const required = await new DocumentationChanges({ github, context }).requiresGeneration({
            paths: process.env.SKIP_IF_ONLY_CHANGED,
            checkoutRef: process.env.CHECKOUT_REF,
            workflowRef: process.env.WORKFLOW_REF,
            attempt: Number(process.env.RUN_ATTEMPT),
            workspace: process.env.WORKSPACE,
            workingDirectory: process.env.WORKING_DIRECTORY,
            valuesFile: process.env.VALUES_FILE,
          });
          core.setOutput('required', required);
          core.info(required ? 'Generate Helm documentation.' : 'Helm documentation inputs are unchanged since successful CI.');

    - if: ${{ steps.changes.outputs.required == 'true' && (inputs.checkout-ref != '') }}
      uses: hoverkraft-tech/ci-github-common/actions/checkout@f165c0ca3e88604611481e1408ace1e0e3a5ee47 # 4.3.1
      with:
        ref: ${{ inputs.checkout-ref }}

    - uses: losisin/helm-docs-github-action@9e0787c426fdec38be6288bb5c0559dcb388412c # v2.0.1
      if: steps.changes.outputs.required == 'true'
      with:
        chart-search-root: ${{ steps.prepare-variables.outputs.working-directory }}

    - if: ${{ steps.changes.outputs.required == 'true' && (steps.prepare-variables.outputs.values-file) }}
      uses: losisin/helm-values-schema-json-action@3bbbe5960e765b4e45205e6b3af45daeaec7d7f5 # v3.2.1
      with:
        values: ${{ steps.prepare-variables.outputs.values-file }}
        working-directory: ${{ steps.prepare-variables.outputs.working-directory }}

    - name: Format generated documentation
      if: steps.changes.outputs.required == 'true'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORKING_DIRECTORY: ${{ steps.prepare-variables.outputs.working-directory }}
        VALUES_FILE: ${{ steps.prepare-variables.outputs.values-file }}
        TEXTLINT_CONFIG: ${{ steps.prepare-variables.outputs.textlint-config-path }}
        MARKDOWNLINT_CONFIG: ${{ steps.prepare-variables.outputs.markdownlint-config-path }}
      with:
        script: |
          const { pathToFileURL } = require('node:url');
          const { formatDocumentation } = await import(pathToFileURL(`${process.env.ACTION_PATH}/dist/index.js`));
          await formatDocumentation({
            workingDirectory: process.env.WORKING_DIRECTORY,
            valuesFile: process.env.VALUES_FILE,
            textlintConfig: process.env.TEXTLINT_CONFIG,
            markdownlintConfig: process.env.MARKDOWNLINT_CONFIG,
            core,
          });

    - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      if: ${{ steps.changes.outputs.required == 'true' && (inputs.github-app-client-id) }}
      id: generate-token
      with:
        client-id: ${{ inputs.github-app-client-id }}
        private-key: ${{ inputs.github-app-key }}
        permission-contents: write
        permission-pull-requests: write

    - uses: hoverkraft-tech/ci-github-common/actions/create-and-merge-pull-request@f165c0ca3e88604611481e1408ace1e0e3a5ee47 # 4.3.1
      if: steps.changes.outputs.required == 'true'
      id: create-and-merge-pull-request
      with:
        github-token: ${{ steps.generate-token.outputs.token || inputs.github-token }}
        merge-method: ${{ inputs.merge-method }}
        branch: docs/update-helm-chart-docs-${{ steps.prepare-variables.outputs.working-directory-name }}
        title: "docs: update Helm chart documentation for ${{ steps.prepare-variables.outputs.working-directory-name }}"
        body: |
          This pull request updates the documentation for the Helm chart `${{ steps.prepare-variables.outputs.working-directory-name }}`.
        commit-message: |
          docs: update Helm chart documentation for ${{ steps.prepare-variables.outputs.working-directory-name }}

          [skip ci]
