---
name: "Test Helm Chart"
description: |
  Install one prepared Helm chart in a fresh kind cluster and run its Helm tests.
  Verify its expected SHA-256 before cluster creation and keep the archive unchanged.
  Uses chart-testing for packaged ci/*-values.yaml scenarios, readiness, Helm tests,
  diagnostics and release cleanup. Test-only values and registry credentials are overlays.
  Requires Helm and chart-testing on PATH; checkout and shared tool setup belong to
  the caller. Source selection and dependency builds belong before Prepare.
  The action owns its unique kind cluster and isolated chart extraction. Temporary
  inputs are removed on success, failure or cancellation; kind's post-job hook removes
  the cluster. The caller retains the original archive.
  Run [Lint Helm Chart](../lint-chart/README.md) first with the same archive/checksum
  and values-files. Release and reusable-workflow composition are separate phases.
author: hoverkraft
branding:
  icon: check-circle
  color: blue

inputs:
  archive:
    description: "Path to the prepared .tgz archive. Relative paths use working-directory."
    required: true
  checksum:
    description: "Expected SHA-256 of the archive bytes, as 64 lowercase hexadecimal characters."
    required: true
  config:
    description: |
      Chart-testing configuration path relative to working-directory; defaults to ct.yaml when present.
      Retains installation timeouts, release settings and diagnostic policies. This action controls
      chart selection, dependency setup, fresh installation, cleanup and debug/configuration output.
    required: false
  values-files:
    description: |
      Validation-only values files, one path per line relative to working-directory.
      Applied in order after each packaged ci/*-values.yaml scenario or chart defaults.
      Later files take precedence. Use the same files with Lint; publication defaults stay unchanged.
    required: false
  working-directory:
    description: "Writable repository directory for configuration and temporary validation files."
    required: false
    default: "${{ github.workspace }}"
  namespace:
    description: |
      Namespace used to install test releases.
      Defaults to a random namespace created for the current workflow run.
    required: false
  helm-set:
    description: |
      Installation-only values, applied after values-files. Never written to the archive.
      Multiple values can be set using multiline string.
      Example:
      ```
      key1=value1
      key2=value2
      ```
    required: false
  oci-registry:
    description: "OCI registry used by the test cluster to pull images"
    default: "ghcr.io"
    required: false
  oci-registry-username:
    description: |
      Username used to log against the OCI registry.
      See https://github.com/docker/login-action#usage.
    default: ${{ github.repository_owner }}
    required: false
  oci-registry-password:
    description: |
      Password or personal access token used to log against the OCI registry.
      Can be passed in using `secrets.GITHUB_TOKEN`.
      See https://github.com/docker/login-action#usage.
    default: ${{ github.token }}
    required: false
runs:
  using: "composite"
  steps:
    - name: Verify and stage prepared chart
      id: chart
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        ARCHIVE: ${{ inputs.archive }}
        CHECKSUM: ${{ inputs.checksum }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CONFIG: ${{ inputs.config }}
        VALUES_FILES: ${{ inputs.values-files }}
        NAMESPACE: ${{ inputs.namespace }}
      with:
        script: |
          const { join } = require('node:path');
          const { pathToFileURL } = require('node:url');
          const { stageChart } = await import(pathToFileURL(join(process.env.ACTION_PATH, 'dist/index.js')));
          const chart = stageChart({
            archive: process.env.ARCHIVE,
            expectedChecksum: process.env.CHECKSUM,
            workingDirectory: process.env.WORKING_DIRECTORY,
            config: process.env.CONFIG,
            valuesFiles: process.env.VALUES_FILES,
            namespace: process.env.NAMESPACE,
          });
          core.setOutput('directory', chart.directory);
          core.setOutput('cluster-name', chart.clusterName);
          core.setOutput('kubeconfig', chart.kubeconfig);

    - name: Create fresh kind cluster
      uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
      with:
        cluster_name: ${{ steps.chart.outputs.cluster-name }}
        kubeconfig: ${{ steps.chart.outputs.kubeconfig }}

    - name: Install and test prepared chart
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        DIRECTORY: ${{ steps.chart.outputs.directory }}
        HELM_SET: ${{ inputs.helm-set }}
        OCI_REGISTRY: ${{ inputs.oci-registry }}
        OCI_REGISTRY_USERNAME: ${{ inputs.oci-registry-username }}
        OCI_REGISTRY_PASSWORD: ${{ inputs.oci-registry-password }}
      with:
        script: |
          const { join } = require('node:path');
          const { pathToFileURL } = require('node:url');
          const { installChart } = await import(pathToFileURL(join(process.env.ACTION_PATH, 'dist/index.js')));
          await installChart({
            exec,
            directory: process.env.DIRECTORY,
            helmSet: process.env.HELM_SET,
            registry: process.env.OCI_REGISTRY,
            username: process.env.OCI_REGISTRY_USERNAME,
            password: process.env.OCI_REGISTRY_PASSWORD,
          });

    - name: Clean test inputs
      if: ${{ always() && steps.chart.outputs.directory != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        DIRECTORY: ${{ steps.chart.outputs.directory }}
      with:
        script: |
          require('node:fs').rmSync(process.env.DIRECTORY, { recursive: true, force: true });
