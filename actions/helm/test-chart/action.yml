---
name: "Test Helm Chart"
description: |
  Install selected source Helm charts in a fresh kind cluster and run their Helm tests
  using [helm/chart-testing-action](https://github.com/helm/chart-testing-action).
  Run static validation separately with [Lint Helm Chart](../lint-chart/README.md)
  before calling this action.
author: hoverkraft
branding:
  icon: check-circle
  color: blue

inputs:
  working-directory:
    description: "Working directory"
    required: false
    default: "${{ github.workspace }}"
  namespace:
    description: |
      Namespace used to install test releases.
      Defaults to a random namespace created for the current workflow run.
    required: false
  helm-set:
    description: |
      Set values for Helm chart.
      Multiple values can be set using multiline string.
      Example:
      ```
      key1=value1
      key2=value2
      ```
    required: false
  helm-repositories:
    description: |
      List of Helm repositories to add before testing charts.
      See https://helm.sh/docs/helm/helm_repo_add/.
    required: false
  oci-registry:
    description: "OCI registry where to pull and push images"
    default: "ghcr.io"
    required: false
  oci-registry-username:
    description: |
      Username used to log against the OCI registry.
      See https://github.com/docker/login-action#usage.
    default: ${{ github.repository_owner }}
    required: false
  oci-registry-password:
    description: |
      Password or personal access token used to log against the OCI registry.
      Can be passed in using `secrets.GITHUB_TOKEN`.
      See https://github.com/docker/login-action#usage.
    default: ${{ github.token }}
    required: false
  check-diff-only:
    description: |
      Only run installation tests on changed charts.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - uses: hoverkraft-tech/ci-github-common/actions/checkout@0864018583d79f7e535f572005baa35f2e864849 # 4.1.0
      with:
        fetch-depth: 0

    - name: Check for .tools-version file
      id: check-tools-version
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');

          const workingDirectory = path.resolve(
            process.env.GITHUB_WORKSPACE ?? '.',
            process.env.WORKING_DIRECTORY ?? '.',
          );
          const toolsVersionPath = path.join(
            workingDirectory,
            '.tools-version',
          );

          core.setOutput(
            'tools-version-exists',
            fs.existsSync(toolsVersionPath) ? 'true' : 'false',
          );

    - name: Install tools with asdf
      if: ${{ steps.check-tools-version.outputs.tools-version-exists == 'true' }}
      uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

    - name: Check for ct.yaml file
      id: check-ct-yaml
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');

          const workingDirectory = path.resolve(
            process.env.GITHUB_WORKSPACE ?? '.',
            process.env.WORKING_DIRECTORY ?? '.',
          );
          const ctConfigPath = path.join(workingDirectory, 'ct.yaml');

          if (fs.existsSync(ctConfigPath)) {
            core.setOutput('path', 'ct.yaml');
          }

    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0

    - name: Set up chart-testing
      uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

    - name: Prepare chart dependencies
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        HELM_REPOSITORIES: ${{ inputs.helm-repositories }}
      with:
        script: |
          const path = require('node:path');
          const workingDirectory = path.resolve(
            process.env.GITHUB_WORKSPACE ?? '.',
            process.env.WORKING_DIRECTORY ?? '.',
          );
          const repositories = (process.env.HELM_REPOSITORIES ?? '')
            .split(/\r?\n/).map(line => line.trim()).filter(Boolean);
          for (const repository of repositories) {
            await exec.exec('helm', ['repo', 'add', ...repository.split(/\s+/)]);
          }

          const globber = await glob.create(`${workingDirectory}/**/Chart.yaml`, { followSymbolicLinks: false });
          const chartDirectories = [];
          for await (const file of globber.globGenerator()) {
            chartDirectories.push(path.dirname(file));
          }
          // Keep nested source charts current until Test consumes prepared archives.
          chartDirectories.sort((a, b) => b.split(path.sep).length - a.split(path.sep).length || a.localeCompare(b));
          for (const directory of chartDirectories) {
            await exec.exec('helm', ['dependency', 'build', directory]);
          }

    - name: Prepare ct variables
      id: prepare-ct-variables
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        INPUT_CHECK_DIFF_ONLY: ${{ inputs.check-diff-only }}
        INPUT_NAMESPACE: ${{ inputs.namespace }}
        CT_CONFIG_PATH: ${{ steps.check-ct-yaml.outputs.path }}
      with:
        script: |
          const { randomUUID } = require('node:crypto');

          const args = [];

          if (process.env.INPUT_CHECK_DIFF_ONLY === 'true') {
            const targetBranch = context.eventName === 'pull_request'
              ? context.payload.pull_request?.base?.ref
              : context.payload.repository?.default_branch;

            if (targetBranch) {
              args.push('--target-branch', targetBranch);
            }
          }

          if (process.env.CT_CONFIG_PATH) {
            args.push('--config', process.env.CT_CONFIG_PATH);
          }

          if (args.length === 0) {
            args.push('--all');
          }

          core.setOutput('args', args.join(' '));
          core.setOutput('args-json', JSON.stringify(args));
          const namespace = process.env.INPUT_NAMESPACE?.trim();

          core.setOutput(
            'namespace',
            namespace ||
              `test-chart-${process.env.GITHUB_RUN_ID}-${randomUUID()}`,
          );

    - name: Create kind cluster
      uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

    - name: Install default OCI registry secrets
      id: oci-registry-secret
      if: ${{ inputs.oci-registry != '' && inputs.oci-registry-username != '' && inputs.oci-registry-password != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        NAMESPACE: ${{ steps.prepare-ct-variables.outputs.namespace }}
        INPUT_OCI_REGISTRY: ${{ inputs.oci-registry }}
        INPUT_OCI_REGISTRY_USERNAME: ${{ inputs.oci-registry-username }}
        INPUT_OCI_REGISTRY_PASSWORD: ${{ inputs.oci-registry-password }}
      with:
        script: |
          const secretName = 'regcred';
          const namespace = process.env.NAMESPACE;

          core.setOutput('name', secretName);

          const namespaceExists = await exec.exec(
            'kubectl',
            ['get', 'namespace', namespace],
            {
              ignoreReturnCode: true,
              silent: true,
            },
          );

          if (namespaceExists !== 0) {
            await exec.exec('kubectl', ['create', 'namespace', namespace]);
          }

          const secretExists = await exec.exec(
            'kubectl',
            ['get', 'secret', secretName, `--namespace=${namespace}`],
            {
              ignoreReturnCode: true,
              silent: true,
            },
          );

          if (secretExists === 0) {
            core.info(
              `[helm-test-chart] Reusing OCI registry secret '${secretName}' in namespace '${namespace}'.`,
            );
            return;
          }

          await exec.exec('kubectl', [
            '--context',
            'kind-chart-testing',
            'create',
            'secret',
            'docker-registry',
            secretName,
            `--namespace=${namespace}`,
            `--docker-server=${process.env.INPUT_OCI_REGISTRY}`,
            `--docker-username=${process.env.INPUT_OCI_REGISTRY_USERNAME}`,
            `--docker-password=${process.env.INPUT_OCI_REGISTRY_PASSWORD}`,
          ]);

    - name: Run chart-testing (install)
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CT_ARGS_JSON: ${{ steps.prepare-ct-variables.outputs.args-json }}
        NAMESPACE: ${{ steps.prepare-ct-variables.outputs.namespace }}
        INPUT_HELM_SET: ${{ inputs.helm-set }}
        OCI_REGISTRY_SECRET: ${{ steps.oci-registry-secret.outputs.name }}
        HELM_EXPERIMENTAL_OCI: true
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const path = require('node:path');

          const workingDirectory = path.resolve(
            process.env.GITHUB_WORKSPACE ?? '.',
            process.env.WORKING_DIRECTORY ?? '.',
          );
          const namespace = process.env.NAMESPACE;
          const ctArgs = JSON.parse(process.env.CT_ARGS_JSON ?? '[]');
          const helmSetLines = (process.env.INPUT_HELM_SET ?? '').split(/\r?\n/)
            .map((line) => line.trim())
            .filter((line) => line.length > 0)
            .map((line) => line.replaceAll(',', '\\,'));

          const ociRegistrySecret = process.env.OCI_REGISTRY_SECRET ?? '';
          if (ociRegistrySecret) {
            await exec.exec('kubectl', [
              'get',
              'secret',
              ociRegistrySecret,
              '--output=yaml',
              `--namespace=${namespace}`,
            ]);

            helmSetLines.push(
              `imagePullSecrets[0].name=${ociRegistrySecret}`,
            );
          }

          const installArgs = [
            'install',
            ...ctArgs,
            '--namespace',
            namespace,
          ];

          if (helmSetLines.length > 0) {
            installArgs.push(
              '--helm-extra-set-args',
              `--set=${helmSetLines.join(',')}`,
            );
          }

          await exec.exec('ct', installArgs, {
            cwd: workingDirectory,
          });
